<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multi-Agent Harness Console</title>
<style>
/* Layout: OpenChamber-style shell. Session sidebar | chat column | context panel + icon rail.
   Dark-first (OpenChamber default dark), light theme mirrors it. Palette: cool slate surfaces, teal accent;
   amber means "waiting on you", red is kept for errors. */
:root{
  color-scheme: dark;
  --bg:#111820; --surface:#18202a; --surface-2:#1f2935; --surface-3:#283443;
  --border:#253140; --border-strong:#334255;
  --fg:#c9d3de; --fg-strong:#eef3f8; --muted:#8a99ab; --faint:#66768a;
  --accent:#5fd4c8; --accent-hover:#7fe0d6; --accent-soft:#173238; --on-accent:#062b28;
  --user-bubble:#1b333b; --user-fg:#dcefef;
  --ok:#78c489; --warn:#e8b65a; --err:#ef7468; --info:#6ea8ef;
  --ok-soft:rgba(120,196,137,.13); --warn-soft:rgba(232,182,90,.12); --err-soft:rgba(239,116,104,.13); --info-soft:rgba(110,168,239,.12);
  --code:#9fd28e; --link:#7cc3ec;
  --a-orch:#5fd4c8; --a-explorer:#6cbfe0; --a-coder1:#8ea6f5; --a-coder2:#b996ef; --a-tester:#ee93c0; --a-reviewer:#d9bf8c;
  --k-tool:#7d8fa6; --k-wait:#53647a;
  --syn-kw:#c3a0f5; --syn-str:#9fd28e; --syn-ty:#6cc6e0; --syn-fn:#8ea6f5; --syn-com:#66768a; --syn-num:#e8b65a; --syn-mac:#ee93c0;
  --cx-sys:#4c94ec; --cx-tools:#9365a7; --cx-hist:#32a88e; --cx-files:#0c82bf;
  --shadow:0 12px 36px rgba(0,0,0,.5);
  --hl:inset 0 1px 0 rgba(255,255,255,.04);
  --k-model:var(--accent);
  --font-ui:"Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-display:"Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono:ui-monospace, "Cascadia Code", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600;
  --r:9px; --r-md:7px; --r-sm:4px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#f2f5f8; --surface:#e9eef3; --surface-2:#ffffff; --surface-3:#dde4ec;
    --border:#d6dee8; --border-strong:#c0ccda;
    --fg:#283341; --fg-strong:#0f1925; --muted:#5a6879; --faint:#7f8c9c;
    --accent:#0b746e; --accent-hover:#08625d; --accent-soft:#d9efed; --on-accent:#ffffff;
    --user-bubble:#d9efed; --user-fg:#0f302c;
    --ok:#2a7639; --warn:#8f5b00; --err:#b8382a; --info:#2865b2;
    --ok-soft:rgba(42,118,57,.10); --warn-soft:rgba(143,91,0,.10); --err-soft:rgba(184,56,42,.09); --info-soft:rgba(40,101,178,.09);
    --code:#2e7438; --link:#22668f;
    --a-orch:#0b746e; --a-explorer:#1f7fa3; --a-coder1:#3d5fc4; --a-coder2:#7449c0; --a-tester:#b2457c; --a-reviewer:#86692c;
    --k-tool:#8796aa; --k-wait:#a9b6c6;
    --syn-kw:#7449c0; --syn-str:#2e7438; --syn-ty:#1f7fa3; --syn-fn:#3d5fc4; --syn-com:#7f8c9c; --syn-num:#8f5b00; --syn-mac:#b2457c;
    --cx-sys:#285994; --cx-tools:#927ad2; --cx-hist:#29a288; --cx-files:#1870a1;
    --shadow:0 12px 36px rgba(20,35,55,.14);
    --hl:inset 0 1px 0 rgba(255,255,255,.7);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f2f5f8; --surface:#e9eef3; --surface-2:#ffffff; --surface-3:#dde4ec;
  --border:#d6dee8; --border-strong:#c0ccda;
  --fg:#283341; --fg-strong:#0f1925; --muted:#5a6879; --faint:#7f8c9c;
  --accent:#0b746e; --accent-hover:#08625d; --accent-soft:#d9efed; --on-accent:#ffffff;
  --user-bubble:#d9efed; --user-fg:#0f302c;
  --ok:#2a7639; --warn:#8f5b00; --err:#b8382a; --info:#2865b2;
  --ok-soft:rgba(42,118,57,.10); --warn-soft:rgba(143,91,0,.10); --err-soft:rgba(184,56,42,.09); --info-soft:rgba(40,101,178,.09);
  --code:#2e7438; --link:#22668f;
  --a-orch:#0b746e; --a-explorer:#1f7fa3; --a-coder1:#3d5fc4; --a-coder2:#7449c0; --a-tester:#b2457c; --a-reviewer:#86692c;
  --k-tool:#8796aa; --k-wait:#a9b6c6;
  --syn-kw:#7449c0; --syn-str:#2e7438; --syn-ty:#1f7fa3; --syn-fn:#3d5fc4; --syn-com:#7f8c9c; --syn-num:#8f5b00; --syn-mac:#b2457c;
  --cx-sys:#285994; --cx-tools:#927ad2; --cx-hist:#29a288; --cx-files:#1870a1;
  --shadow:0 12px 36px rgba(20,35,55,.14);
  --hl:inset 0 1px 0 rgba(255,255,255,.7);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fw-regular) 13.5px/1.5 var(--font-ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
b,strong{font-weight:var(--fw-semibold)}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
code,.mono{font-family:var(--font-mono)}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:14px;height:14px}.ic.xs{width:11px;height:11px;stroke-width:2.4}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.spacer{flex:1}
.ibtn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:var(--r-md);color:var(--muted);flex:none}
.ibtn:hover{background:var(--surface-3);color:var(--fg)}
.mobile-only{display:none}

/* ---------- shell: host rail | title bar / sidebar + main + right rail / status bar ----------
   The left column stands in for the host app's own rail (chat, Jira, GitHub, ...): the harness adds nothing there.
   Every harness view opens from the right rail. .simple (Details off) hides everything tagged .d-only. */
.app{display:grid;height:100%;grid-template-columns:44px 272px minmax(0,1fr) 44px;grid-template-rows:40px minmax(0,1fr) auto;grid-template-areas:"host title title title" "host side main rail" "host status status status"}
.app.side-hidden{grid-template-columns:44px 0 minmax(0,1fr) 44px}
.app.side-hidden .sidebar{display:none}
.app.simple .statusbar{display:none}
.titlebar{grid-area:title}
.hostrail{grid-area:host}
.rail{grid-area:rail}
.app.simple .d-only{display:none!important}
.sidebar{grid-area:side;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;min-width:0}
.main{grid-area:main;display:flex;flex-direction:column;min-width:0;min-height:0}
.statusbar{grid-area:status}
.work{flex:1;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.app.panel-open .work{grid-template-columns:minmax(0,1fr) 360px}
.app.code .work{grid-template-columns:minmax(0,1fr) 400px}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.scroll{flex:1;overflow-y:auto;min-height:0;scroll-behavior:auto}
.thread{max-width:840px;margin-inline:auto;padding:22px 24px 18px;display:flex;flex-direction:column;gap:18px}
.panel{display:none;border-left:1px solid var(--border);background:var(--surface);flex-direction:column;min-height:0;min-width:0}
.app.panel-open .panel{display:flex}
.app.code .panel{display:none}
.app.code .chat{background:var(--surface)}
.app.code .thread{padding:16px 14px 12px;gap:14px}
.app.code .composer-wrap{padding:0 12px 10px}
.scrim{display:none}

/* ---------- title bar, host rail, right rail, status bar ---------- */
.titlebar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:0 8px 0 12px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.tb-l{display:flex;align-items:center;gap:9px;min-width:0}
.tb-r{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.tb-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.titlebar .chip{height:26px}
.modes{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--bg);border:1px solid var(--border)}
.modes button{height:26px;padding:0 16px;border-radius:7px;font-size:12.5px;font-weight:var(--fw-medium);color:var(--muted)}
.modes button:hover{color:var(--fg)}
.modes button.on{background:var(--surface-3);color:var(--fg-strong);box-shadow:var(--hl)}
.ibtn.on{color:var(--accent)}
.dswitch{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px 0 6px;border-radius:999px;border:1px solid var(--border);font-size:12px;color:var(--muted);white-space:nowrap}
.dswitch:hover{border-color:var(--border-strong);color:var(--fg)}
.dsw-t{width:26px;height:16px;border-radius:8px;background:var(--surface-3);position:relative;flex:none;transition:background .15s}
.dsw-t i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.dswitch[aria-checked="true"]{color:var(--fg-strong);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.dswitch[aria-checked="true"] .dsw-t{background:var(--accent-soft)}
.dswitch[aria-checked="true"] .dsw-t i{transform:translateX(10px);background:var(--accent)}
.tr-compact{display:flex;align-items:center;gap:8px;min-width:0;padding:9px 12px;font-size:13px}
.tr-compact b{color:var(--fg-strong);font-weight:var(--fw-semibold)}
.tr-compact .tc-act{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12.5px}
.tr-compact .sp{flex:none}
.hostrail{background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;min-height:0}
.hostrail .abtn{color:var(--faint)}
.hostrail .abtn.on{color:var(--fg-strong);background:var(--surface-3)}
.hostrail .abtn.on::before{background:var(--fg-strong)}
.hr-tag{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:6px 0 2px}
.rail{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;min-height:0}
.rail .sep{width:20px;height:1px;background:var(--border);margin:4px 0}
.abtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);position:relative;flex:none}
.abtn:hover{background:var(--surface-3);color:var(--fg)}
.abtn.on{color:var(--accent);background:var(--accent-soft)}
.abtn.on::before{content:"";position:absolute;left:-7px;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--accent)}
.rail .abtn.on::before{left:auto;right:-5px}
.hostrail .spacer{flex:1}
.statusbar{height:26px;display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--surface);border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.sbi{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px;border-radius:5px;color:var(--muted);flex:none}
.sbi .ic{width:12px;height:12px}
button.sbi:hover{background:var(--surface-3);color:var(--fg)}
.statusbar .conn{margin-left:0;display:inline-flex}
.statusbar .mono{font-size:11px}

/* ---------- chat header ---------- */
.chathead{height:42px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;border-bottom:1px solid var(--border);min-width:0}
.ch-tab{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;color:var(--fg-strong);font-weight:var(--fw-semibold);min-width:0;white-space:nowrap;box-shadow:var(--hl)}
.ch-tab>.ic:first-child{color:var(--accent)}
.ch-tab .crumb{font-weight:var(--fw-medium);color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.ch-tab .crumb:hover{color:var(--fg)}
.ch-tab .cur{overflow:hidden;text-overflow:ellipsis}
.ch-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:inline-flex;gap:6px;align-items:center}
.chathead .chip{height:26px;flex:none}

/* ---------- sidebar ---------- */
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.logo .ic{width:13px;height:13px;stroke-width:2.4}
.wordmark{font-weight:var(--fw-semibold);color:var(--fg-strong);letter-spacing:.01em}
.sb-head{height:42px;flex:none;display:flex;align-items:center;gap:2px;padding:0 6px 0 14px}
.sb-head h2{flex:1;margin:0;font-size:13px;font-weight:var(--fw-semibold);color:var(--fg-strong);display:flex;align-items:center;gap:8px;min-width:0}
.sb-head h2 .ic{color:var(--muted)}
.sb-head .ibtn{width:28px;height:28px}
.sb-search{margin:0 10px 6px;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:var(--r-md);background:var(--bg);border:1px solid var(--border);color:var(--faint);flex:none}
.sb-search:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,var(--border))}
.sb-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:12.5px;color:var(--fg)}
.sb-search input::placeholder{color:var(--faint)}
.sb-scroll,.sb-body{flex:1;overflow:auto;min-height:0}
.sb-scroll{padding:2px 8px 12px}
.sb-gh{display:flex;align-items:center;gap:7px;width:100%;padding:10px 8px 4px;font-size:12px;font-weight:var(--fw-semibold);color:var(--muted);text-align:left}
.sb-gh:hover{color:var(--fg)}
.sb-gh .ic{color:var(--faint)}
.sb-gh .gl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-gh .gn{font-size:11px;font-weight:var(--fw-medium);color:var(--faint)}
.sb-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px 6px 10px;border-radius:var(--r-md);color:var(--fg);white-space:nowrap;min-width:0}
.sb-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sb-row .meta{font-size:11.5px;color:var(--faint);font-weight:var(--fw-regular)}
.sb-row:hover{background:var(--surface-3)}
.sb-row.active{background:var(--surface-3);color:var(--fg-strong);font-weight:var(--fw-semibold)}
.sb-row.active .meta{color:var(--accent);font-weight:var(--fw-medium)}
.sdot{width:7px;height:7px;border-radius:50%;flex:none}
.sdot.need{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.sdot.live{background:var(--accent)}
.sb-kids{margin:2px 0 6px 13px;padding-left:6px;border-left:1px solid var(--border-strong);display:flex;flex-direction:column;gap:1px}
.sb-agent{padding:4px 8px 4px 10px;font-size:12.5px;gap:8px}
.sb-agent.sel{background:var(--surface-3);color:var(--fg-strong)}
.sb-more{padding:4px 8px 4px 25px;font-size:12px;color:var(--faint)}
.sb-wt .ic{color:var(--muted)}
.sidebar .graph svg{min-width:0}
.conn{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ---------- code view (W1–W6) ---------- */
.sb-tabs{display:flex;gap:2px;padding:0 8px;height:42px;align-items:flex-end;border-bottom:1px solid var(--border);flex:none}
.sb-tabs button{padding:0 8px 10px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.sb-tabs button:hover{color:var(--fg)}
.sb-tabs button.on{color:var(--fg-strong);border-bottom-color:var(--accent)}
.sb-tabs .n{font-size:11px;color:var(--faint);margin-left:5px}
.wtpick{display:flex;gap:4px;flex-wrap:wrap;padding:10px 10px 4px}
.wtpick button{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--border);font-size:12px;color:var(--muted)}
.wtpick button.on{color:var(--fg-strong);border-color:var(--border-strong);background:var(--surface-3)}
.wtmeta{padding:2px 14px 6px;font-size:11.5px;color:var(--faint);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{padding:2px 6px 12px}
.tr-row{display:flex;align-items:center;gap:6px;width:100%;height:26px;padding:0 8px 0 calc(8px + var(--d,0)*14px);border-radius:6px;font-size:12.5px;color:var(--fg);text-align:left;white-space:nowrap}
.tr-row:not(.dir){padding-left:calc(26px + var(--d,0)*14px)}
.tr-row:hover{background:var(--surface-3)}
.tr-row.on{background:var(--accent-soft);color:var(--fg-strong)}
.tr-row .ic{color:var(--muted)}
.tr-row .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--warn);opacity:.85}
.ts{font:600 11px var(--font-mono);width:12px;text-align:center;flex:none}
.ts.M{color:var(--warn)}.ts.A{color:var(--ok)}.ts.D{color:var(--err)}
.chg{padding:2px 8px 12px;display:flex;flex-direction:column;gap:1px}
.chg-g{display:flex;align-items:center;gap:7px;padding:10px 6px 4px;font-size:12px;color:var(--muted)}
.chg-g b{font-family:var(--font-mono);font-weight:var(--fw-medium);color:var(--fg);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chg-f{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center;height:26px;padding:0 8px;border-radius:6px;font-size:12px;text-align:left}
.chg-f:hover{background:var(--surface-3)}
.chg-f.on{background:var(--accent-soft)}
.chg-f .p{font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.editor{display:none;flex-direction:column;min-width:0;min-height:0;background:var(--bg);border-right:1px solid var(--border)}
.app.code .editor{display:flex}
.ed-tabs{height:42px;flex:none;display:flex;align-items:flex-end;gap:2px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.ed-tab{display:flex;align-items:center;height:34px;border-radius:7px 7px 0 0;color:var(--muted);font-size:12.5px;border:1px solid transparent;border-bottom:0;flex:none}
.ed-tab>button:first-child{display:inline-flex;align-items:center;gap:7px;padding:0 4px 0 11px;height:100%}
.ed-tab .x{width:22px;height:22px;margin-right:5px;border-radius:5px;display:grid;place-items:center;opacity:.55}
.ed-tab .x:hover{background:var(--surface-3);opacity:1}
.ed-tab.on{background:var(--bg);color:var(--fg-strong);border-color:var(--border);margin-bottom:-1px;height:35px}
.ed-path{height:40px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);min-width:0}
.ed-path .crumbs{flex:0 1 auto;display:flex;gap:5px;white-space:nowrap;font-family:var(--font-mono);font-size:12px;min-width:0}
.ed-path .crumbs .dirs{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ed-path .crumbs b{flex:none;color:var(--fg-strong);font-weight:var(--fw-medium)}
.ed-path .meta{flex:0 100 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-path .pill{flex:none}
.app.code .c-role,.app.code .c-byok,.app.code .to-hint,.app.code .ctl.on .hide-m{display:none}
.ed-body{flex:1;overflow:auto;font:12.5px/1.75 var(--font-mono);padding:10px 0 28px;min-height:0;display:flex;flex-direction:column}
.lnr{display:grid;grid-template-columns:3px 54px minmax(0,1fr);min-width:max-content}
.lnr .gm.a{background:var(--ok)}
.lnr .gm.m{background:var(--info)}
.lnr .no{color:var(--faint);text-align:right;padding-right:18px;user-select:none}
.lnr .tx{white-space:pre;color:var(--fg);padding-right:32px}
.lnr:hover{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.lnr .tx .caret{height:13px;vertical-align:-2px}
.ed-empty{margin:auto;color:var(--muted);font:13px/1.5 var(--font-ui);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:24px;max-width:340px}
.ed-empty .ic{width:28px;height:28px;color:var(--faint)}
.ed-body .diff{background:transparent;border:0;border-radius:0;font-size:12.5px;padding:0}
.t-kw{color:var(--syn-kw)}.t-str{color:var(--syn-str)}.t-ty{color:var(--syn-ty)}.t-fn{color:var(--syn-fn)}.t-com{color:var(--syn-com);font-style:italic}.t-num{color:var(--syn-num)}.t-mac{color:var(--syn-mac)}

.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--fg);white-space:nowrap;background:transparent}
button.chip:hover{border-color:var(--border-strong);background:var(--surface-2)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn);background:var(--warn-soft)}
/* context gauge (H6): 270° arc, tick at the compaction threshold (D11); --heat ramps it to amber over the last 15 points */
.chip.gauge{font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--warn) var(--heat,0%),var(--fg))}
.gauge svg{width:18px;height:18px;overflow:visible;flex:none}
.gauge .trk,.gauge .val{fill:none;stroke-width:3;stroke-linecap:round}
.gauge .trk{stroke:var(--surface-3)}
.gauge .val{stroke:color-mix(in srgb,var(--warn) var(--heat,0%),var(--muted))}
.gauge .thr{stroke:var(--fg-strong);stroke-width:1.5;stroke-linecap:round;opacity:.8}
.chip.gauge[aria-expanded="true"]{border-color:var(--border-strong);background:var(--surface-2)}
.gwrap{position:relative;display:inline-flex}
/* context breakdown popover (H11) */
.ctxpop{position:absolute;top:calc(100% + 8px);right:0;z-index:36;width:312px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 12px 10px;font-size:12.5px;color:var(--fg);white-space:normal;cursor:default}
.cxp-in{display:flex;flex-direction:column;gap:8px}
.cxp-h{display:flex;align-items:center;gap:7px;min-width:0}
.cxp-h b{color:var(--fg-strong);font-size:13px}
.cxp-t{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cxp-t b{font-size:12.5px}
.cxb{position:relative;height:8px;border-radius:4px;background:var(--surface-3);margin-top:4px}
.cxb-f{position:absolute;inset:0;display:flex;border-radius:4px;overflow:hidden}
.cxb-f i{height:100%;flex:none;border-right:2px solid var(--surface-2)}
.cxb .cxt{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--fg-strong);opacity:.6}
.cxb-ax{position:relative;height:13px;margin-top:-3px;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.cxb-ax span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.cxr{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:5px 8px;align-items:center}
.cxr i{width:10px;height:10px;border-radius:3px}
.cxr-l{color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cxr-l span{color:var(--faint)}
.cxr-v{text-align:right;color:var(--fg-strong);font-variant-numeric:tabular-nums}
.cxp-f{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding-top:8px;font-size:12px;color:var(--muted)}
.cxp-f b{color:var(--fg)}

/* ---------- status glyphs & pills ---------- */
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,var(--muted))}
.sg{width:12px;height:12px;flex:none;display:inline-grid;place-items:center;border-radius:50%;font-size:9px;font-weight:var(--fw-semibold);line-height:1;position:relative}
.sg.run{border:2px solid var(--info);border-right-color:transparent;animation:spin 1s linear infinite}
.sg.wait{border:2px dotted var(--accent);animation:spin 4s linear infinite}
.sg.need{background:var(--warn);color:var(--bg)}
.sg.idle{border:1.5px solid var(--faint)}
.sg.done{background:var(--ok);color:var(--bg)}
.sg.block{border:1.5px solid var(--faint)}
.sg.block::after{content:"";position:absolute;width:9px;height:1.5px;background:var(--faint);transform:rotate(-45deg)}
.sg.prop{border:1.5px dashed var(--accent)}
.sg.err{background:var(--err)}
@keyframes spin{to{transform:rotate(360deg)}}
.sp{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sp.warn{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:var(--fw-medium);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.pill.role{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.tid{font-family:var(--font-mono);font-size:11.5px;font-weight:var(--fw-semibold);color:var(--muted);background:var(--surface-3);border-radius:var(--r-sm);padding:0 5px;line-height:18px;white-space:nowrap}
.kind{font-size:11px;font-weight:var(--fw-semibold);letter-spacing:.03em;text-transform:uppercase;padding:0 6px;border-radius:var(--r-sm);line-height:17px;border:1px solid var(--border-strong);color:var(--muted)}
.kind.question{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.kind.steer{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.kind.answer{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}

/* ---------- buttons ---------- */
.btn{height:28px;padding:0 11px;border-radius:var(--r-md);border:1px solid var(--border-strong);font-size:12.5px;font-weight:var(--fw-medium);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--fg);background:var(--surface-2)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--err)}
.btn.xs{height:24px;padding:0 8px;font-size:12px}
.btn kbd,.kbd{font-family:var(--font-mono);font-size:10.5px;opacity:.7;font-weight:var(--fw-regular)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btns.end{justify-content:flex-end}

/* ---------- messages ---------- */
.older{align-self:center;display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);border:1px dashed var(--border-strong);border-radius:999px;padding:4px 12px}
.older:hover{color:var(--fg)}
.msg-user{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bubble{max-width:min(580px,88%);background:var(--user-bubble);color:var(--user-fg);padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55}
.to-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.msg-time{font-size:11.5px;color:var(--faint);display:flex;gap:6px;align-items:center}
.msg-time .ok{color:var(--ok)}
.msg-asst{display:flex;flex-direction:column;gap:8px;min-width:0}
.ah{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.ah b{color:var(--fg-strong);font-weight:var(--fw-semibold)}
.think{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:baseline;min-width:0}
.think b{color:var(--fg);font-weight:var(--fw-medium);flex:none}
.think span{font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.acts{border-left:1px solid var(--border-strong);margin-left:5px;padding-left:14px;display:flex;flex-direction:column}
.acts-h{font-size:12px;color:var(--faint);margin-bottom:2px}
.act{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:23px;min-width:0}
.act .ic{color:var(--muted)}
.act b{font-weight:var(--fw-medium);color:var(--fg);flex:none}
.act .arg{color:var(--muted);font-family:var(--font-mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.act .dur{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px;flex:none}
.md{line-height:1.65;font-size:14px;color:var(--fg);min-width:0;overflow-wrap:anywhere}
.md p{margin:0 0 6px}.md p:last-child{margin-bottom:0}
.md ul{margin:4px 0 0;padding-left:20px}
.md li{margin:2px 0}
.md b{color:var(--fg-strong);font-weight:var(--fw-semibold)}
.md code,.q code,.br-t code{font-size:12.5px;color:var(--code);background:var(--surface-2);padding:1px 5px;border-radius:var(--r-sm)}
.ameta{display:flex;gap:14px;color:var(--faint);font-size:12px;flex-wrap:wrap}
.ameta span{display:inline-flex;align-items:center;gap:5px}
.caret{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- cards ---------- */
.card{border:1px solid var(--border);background:var(--surface);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;flex-wrap:wrap;min-width:0}
.card-h b{color:var(--fg-strong);font-weight:var(--fw-semibold)}
button.card-h{width:100%;text-align:left}
.card-b{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.needs{border-color:color-mix(in srgb,var(--warn) 55%,var(--border));border-left:3px solid var(--warn)}
.card.accent{border-color:color-mix(in srgb,var(--accent) 60%,var(--border))}
.card.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.q{margin:0;font-size:14px;color:var(--fg-strong);line-height:1.55}
.small{font-size:12.5px;margin:0}
.reply{display:flex;gap:8px}
.reply input{flex:1;min-width:0;height:30px;border-radius:var(--r-md);border:1px solid var(--border-strong);background:var(--bg);padding:0 10px;outline:0}
.reply input:focus{border-color:var(--accent)}
.resolved{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.resolved b{color:var(--fg)}

/* task (subagent) card */
.tcard .card-h{padding-bottom:6px}
.tc-kind{font-size:11px;font-weight:var(--fw-semibold);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tc-title{color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 140px}
.tc-act{font-size:13px;color:var(--fg)}
.shine{background:linear-gradient(90deg,var(--muted) 0%,var(--fg-strong) 45%,var(--muted) 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.6s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--muted));border-radius:2px}
.tc-meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tc-meta span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tc-meta .ic{width:12px;height:12px}
.report{font-size:13px;color:var(--fg);border-top:1px solid var(--border);padding-top:10px}

/* plan */
.ptasks{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.ptask{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 10px;font-size:12.5px;border-top:1px solid var(--border);background:var(--surface-2)}
.ptask:first-child{border-top:0}
.ptask .pt-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.ptask .pt-own{display:inline-flex;gap:6px;align-items:center;color:var(--muted);white-space:nowrap}
.ptask .pt-dep{color:var(--faint);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ptask.add{background:var(--ok-soft)}
.ptask.add .pt-title{color:var(--fg-strong)}
.ptask .mark{font-family:var(--font-mono);font-weight:var(--fw-semibold);width:10px;color:var(--faint)}
.ptask.add .mark{color:var(--ok)}

/* inline mail, brief, scratch, diff */
.mail-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:9px 12px;border-radius:var(--r);border:1px dashed var(--border-strong)}
.mail-row>.ic{color:var(--muted);margin-top:2px}
.mr-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.mr-h b{color:var(--fg);font-weight:var(--fw-medium)}
.mr-t{color:var(--fg);margin-top:2px;overflow-wrap:anywhere}
.brief{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.br-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.br-h b{color:var(--fg-strong);font-weight:var(--fw-semibold)}
.br-t{font-size:14px;line-height:1.6;color:var(--fg)}
.br-m{font-size:12px;color:var(--faint);display:flex;gap:6px 14px;flex-wrap:wrap}
.scratch{border:1px solid var(--border);border-radius:var(--r);padding:8px 12px 10px;background:var(--surface)}
.sc-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.sc-h b{color:var(--fg);font-weight:var(--fw-semibold)}
.scratch ul{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 16px}
.scratch li{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--fg)}
.scratch li.d{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.cb{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--faint);flex:none;display:grid;place-items:center}
.cb.d{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.cb.p{border-color:var(--info);background:linear-gradient(90deg,var(--info) 50%,transparent 50%)}
.diff{font-family:var(--font-mono);font-size:12px;line-height:1.65;overflow-x:auto;background:var(--bg);border-top:1px solid var(--border);border-radius:0 0 var(--r) var(--r);padding:4px 0}
.diff div{white-space:pre;display:flex;min-width:max-content}
.diff .ln{width:40px;flex:none;text-align:right;padding-right:10px;color:var(--faint);user-select:none}
.diff .sg2{width:14px;flex:none;color:var(--faint)}
.diff .a{background:var(--ok-soft)}.diff .a .sg2{color:var(--ok)}
.diff .r{background:var(--err-soft)}.diff .r .sg2{color:var(--err)}
.diff .h{color:var(--info)}
.plus{color:var(--ok);font-variant-numeric:tabular-nums}.minus{color:var(--err);font-variant-numeric:tabular-nums}
.cmd{font-family:var(--font-mono);font-size:12.5px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 10px;overflow-x:auto;white-space:pre;color:var(--fg-strong)}
details{font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer;width:max-content}
details dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:6px 0 0}
details dt{color:var(--faint)} details dd{margin:0;color:var(--fg);font-family:var(--font-mono);font-size:12px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border-strong)}
.divider .dv{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px}
.divider .dv b{color:var(--fg);font-weight:var(--fw-medium);display:inline-flex;gap:6px;align-items:center}
.idle-note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;padding:4px 2px}
.statusline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:2px}

/* ---------- composer ---------- */
.composer-wrap{flex:none;padding:0 24px 14px}
.cw-inner{max-width:792px;margin-inline:auto;display:flex;flex-direction:column;gap:7px;position:relative}
.cstrip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;padding-inline:2px}
.cstrip .ic{color:var(--accent)}
.composer{border:1px solid var(--border-strong);border-radius:12px;background:var(--surface);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 65%,var(--border))}
.c-to{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);min-height:26px}
.to-btn{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 9px;border-radius:999px;background:var(--surface-3);color:var(--fg);font-weight:var(--fw-medium)}
.to-btn:hover{background:var(--border-strong)}
.to-hint{display:inline-flex;align-items:center;gap:6px}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--fg)}
.toggle input{accent-color:var(--accent);margin:0}
textarea#input{width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--fg-strong);font:14px/1.5 var(--font-ui);min-height:46px;max-height:180px;padding:4px 2px}
textarea#input::placeholder{color:var(--faint)}
.c-bar{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.c-bar .chip{height:26px;border-color:transparent;color:var(--muted)}
.c-bar .ctl{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.c-bar button.ctl:hover{background:var(--surface-3);color:var(--fg)}
.c-bar .ctl.on{color:var(--accent)}
.cstats{display:flex;align-items:center;justify-content:center;gap:10px;font-size:11.5px;color:var(--faint);flex-wrap:wrap;min-height:18px}
.cstats .vs{width:1px;height:11px;background:var(--border-strong)}
.cstats .chip.gauge{height:22px;padding:0 7px;border-color:transparent;font-size:11.5px}
.cstats button.chip.gauge:hover{border-color:var(--border)}
.cstats .gauge svg{width:14px;height:14px}
.cstats .ctxpop{top:auto;bottom:calc(100% + 8px);right:-8px;text-align:left}
.c-bar button.chip:hover{color:var(--fg)}
.c-bar .chip.on{color:var(--accent)}
.send{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.send:hover{background:var(--accent-hover)}
.menu{position:absolute;bottom:calc(100% - 34px);left:0;z-index:20;width:300px;max-width:100%;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:1px}
.menu-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:4px 8px;font-weight:var(--fw-semibold)}
.menu button{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-md);text-align:left;font-size:13px}
.menu button:hover,.menu button.on{background:var(--surface-3)}
.menu button .sp{margin-left:auto}

/* ---------- panel ---------- */
.p-head{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;border-bottom:1px solid var(--border)}
.p-head h2{font-size:13.5px;font-weight:var(--fw-semibold);margin:0;color:var(--fg-strong);display:flex;align-items:center;gap:8px}
.p-head h2 .ic{color:var(--muted)}
.ovl-only{display:none}
.p-tabs-m{display:none;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border);overflow-x:auto;flex:none}
.p-tabs-m button{padding:4px 10px;border-radius:999px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.p-tabs-m button.on{background:var(--accent-soft);color:var(--accent)}
.p-body{flex:1;overflow:auto;padding:12px 14px 22px;display:flex;flex-direction:column;gap:10px;min-height:0}
.p-h{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:var(--fw-semibold);margin:8px 0 0;display:flex;align-items:center;gap:8px}
.p-h:first-child{margin-top:0}
.p-h .spacer+button{text-transform:none;letter-spacing:0;font-weight:var(--fw-medium)}
.p-note{font-size:12px;color:var(--faint);margin:-4px 0 0}
.summary{display:flex;gap:6px;flex-wrap:wrap}
.arow{padding:9px 10px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface-2);display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.arow:hover{border-color:var(--border-strong)}
.arow.sel{border-color:color-mix(in srgb,var(--accent) 60%,var(--border))}
.ar-top{display:flex;align-items:center;gap:7px;min-width:0}
.ar-top b{color:var(--fg-strong);font-weight:var(--fw-semibold);font-size:13px}
.ar-top .sp{margin-left:auto}
.ar-act{font-size:12.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar-meta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);min-width:0}
.ar-meta .m{flex:1;min-width:60px}
.ar-meta span{white-space:nowrap;font-variant-numeric:tabular-nums}
.ar-btns{display:flex;gap:2px;margin-left:auto}
.ar-btns .ibtn{width:26px;height:26px}
.meter{position:relative;height:6px;border-radius:3px;background:var(--surface-3)}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--muted)}
.meter i.hot{background:var(--warn)}
.meter .tick{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--fg-strong);opacity:.55}
.trow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px;padding:5px 2px;border-bottom:1px solid var(--border)}
.trow:last-child{border-bottom:0}
.trow .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.trow .own{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-md);padding:2px;gap:2px}
.seg button{padding:2px 9px;border-radius:5px;font-size:12px;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.seg button.on{background:var(--surface-3);color:var(--fg-strong)}
.graph{border:1px solid var(--border);border-radius:var(--r);background:var(--bg);padding:6px;overflow-x:auto}
.graph svg{display:block;width:100%;min-width:300px;height:auto}
.g-edge{fill:none;stroke:var(--border-strong);stroke-width:1.5}
.g-edge.prop{stroke:var(--accent);stroke-dasharray:4 3}
.g-node{cursor:pointer}
.g-node rect{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.25}
.g-node.done rect{stroke:var(--ok)}
.g-node.in_progress rect{stroke:var(--info);stroke-width:1.75}
.g-node.proposed rect{stroke:var(--accent);stroke-dasharray:4 3}
.g-node .gid{fill:var(--muted);font:600 11px var(--font-mono)}
.g-node .gt{fill:var(--fg);font:500 11.5px var(--font-ui)}
.g-node .go{fill:var(--muted);font:11px var(--font-ui)}
.g-node:hover rect{fill:var(--surface-3)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.tcol{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:2px 10px}
.tdet{font-size:12px;color:var(--muted);grid-column:3/-1;margin-top:-2px}
.plan-doc{font-size:13px;line-height:1.6;color:var(--fg);display:flex;flex-direction:column;gap:8px}
.plan-doc h3{margin:0;font-size:15px;color:var(--fg-strong)}
.plan-doc h4{margin:4px 0 0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.plan-doc ul{margin:0;padding-left:18px}
.plan-doc .file{font-family:var(--font-mono);font-size:11.5px;color:var(--faint)}
.vers{display:flex;flex-direction:column;gap:6px}
.ver{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{padding:3px 10px;border-radius:999px;font-size:12px;color:var(--muted);border:1px solid var(--border)}
.filters button.on{color:var(--fg-strong);border-color:var(--border-strong);background:var(--surface-3)}
.mitem{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:9px 10px;display:flex;flex-direction:column;gap:5px}
.mi-h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mi-h b{color:var(--fg);font-weight:var(--fw-medium)}
.mi-t{font-size:13px;color:var(--fg);overflow-wrap:anywhere}
.mi-f{font-size:11.5px;color:var(--faint);display:flex;gap:6px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;background:var(--surface-2);min-width:0}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:17px;font-weight:var(--fw-semibold);color:var(--fg-strong);font-variant-numeric:tabular-nums;line-height:1.3}
.stat .s{font-size:11.5px;color:var(--faint)}
.mrow{display:grid;grid-template-columns:92px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:12px}
.mrow .lab{display:flex;align-items:center;gap:6px;color:var(--fg);white-space:nowrap;overflow:hidden}
.mrow .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.segs{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.segs div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding:6px 10px;font-size:12px;border-top:1px solid var(--border);background:var(--surface-2)}
.segs div:first-child{border-top:0}
.segs .n{font-family:var(--font-mono);color:var(--fg)}
.segs .z{color:var(--muted);font-variant-numeric:tabular-nums}
.tail{font-family:var(--font-mono);font-size:11.5px;line-height:1.75;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);padding:6px 0;overflow-x:auto}
.tail div{display:grid;grid-template-columns:40px 84px 196px minmax(120px,1fr);gap:8px;padding:0 10px;white-space:nowrap;min-width:max-content}
.tail div.new{animation:newrow 1.2s ease-out}
@keyframes newrow{from{background:var(--accent-soft)}to{background:transparent}}
.tail .s1{color:var(--faint);text-align:right}
.tail .s2{overflow:hidden;text-overflow:ellipsis}
.tail .s3{color:var(--fg)}
.tail .s4{color:var(--muted)}
.wt{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.wt-h{display:flex;align-items:center;gap:7px;font-size:12.5px}
.wt-h b{font-family:var(--font-mono);font-weight:var(--fw-medium);color:var(--fg-strong);font-size:12px}
.wt-f{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;font-size:12px;align-items:center}
.wt-f .p{font-family:var(--font-mono);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt-f .st{font-family:var(--font-mono);font-weight:var(--fw-semibold);width:12px}

/* rail */
.badge{position:absolute;top:2px;right:2px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--warn);color:var(--bg);font-size:9.5px;font-weight:var(--fw-semibold);display:grid;place-items:center;line-height:1}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface-3);color:var(--fg-strong);border:1px solid var(--border-strong);padding:8px 14px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);z-index:60;max-width:calc(100vw - 32px)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .app.panel-open .work{grid-template-columns:minmax(0,1fr)}
  .app.code .work{grid-template-columns:minmax(0,1fr) 360px}
  .panel{position:fixed;top:40px;right:44px;bottom:26px;width:min(380px,calc(100vw - 104px));z-index:30;box-shadow:var(--shadow)}
  .app.simple .panel{bottom:0}
  .ovl-only{display:inline-grid}
}
@media (max-width:860px){
  .app,.app.side-hidden{grid-template-columns:minmax(0,1fr);grid-template-areas:"title" "main" "status"}
  .hostrail,.rail{display:none}
  .p-tabs-m{display:flex}
  .sidebar,.app.side-hidden .sidebar{display:flex;position:fixed;top:0;left:0;bottom:0;width:min(320px,88vw);z-index:45;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .app.side-open .sidebar{transform:none}
  .app.code .work{grid-template-columns:minmax(0,1fr)}
  .app.code .chat{display:none}
  .panel{left:0;right:0;width:auto}
  .mobile-only{display:inline-grid}
  .hide-m{display:none!important}
  .titlebar{padding:0 6px;grid-template-columns:auto minmax(0,1fr) auto}
  .modes{justify-self:center}
  .modes button{padding:0 12px}
  .thread{padding:16px 16px 12px}
  .composer-wrap{padding:0 16px 10px}
  .chathead{padding:0 10px}
  .app.side-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
  .tail div{grid-template-columns:40px 84px 180px minmax(120px,1fr)}
}
@media (max-width:560px){
  .cstats .ctxpop{position:fixed;top:auto;bottom:118px;left:16px;right:16px;width:auto}
  .ptask{grid-template-columns:auto auto minmax(0,1fr);}
  .ptask .pt-dep,.ptask .pt-own{grid-column:3}
  .stats{grid-template-columns:minmax(0,1fr)}
  .statusbar .sbi:not(.conn){display:none}
  .ch-sub{display:none}
}
@media (prefers-reduced-motion:reduce){
  .shine{animation:none;background:none;color:var(--fg)}
  .sg.run,.sg.wait,.caret,.tail div.new,.card.flash,.card.arrive{animation:none}
  .dsw-t,.dsw-t i{transition:none}
  .deadline i{transition:none}
  .sidebar{transition:none}
}

/* ---------- additions: rotation, countdown, queue strip, gen chip ---------- */
.gen{font-family:var(--font-mono);font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:var(--r-sm);padding:0 5px;line-height:17px;white-space:nowrap}
.countdown{font-size:12px;color:var(--warn);font-variant-numeric:tabular-nums;display:inline-flex;gap:6px;align-items:center}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* auto-deny bar (C27): drains along the top edge of the permission card over the 90 s window */
.card.expiring{overflow:clip}
.deadline{height:3px;margin-bottom:-3px;position:relative;background:color-mix(in srgb,var(--warn) 16%,transparent)}
.deadline i{display:block;height:100%;background:var(--warn);transform-origin:0 50%;transition:transform 1s linear}
.card.arrive{animation:arrive 1.8s ease-out}
@keyframes arrive{0%{box-shadow:var(--hl),0 0 0 0 transparent,0 0 0 0 transparent}25%{box-shadow:var(--hl),0 0 0 3px color-mix(in srgb,var(--warn) 28%,transparent),0 0 22px 2px color-mix(in srgb,var(--warn) 20%,transparent)}100%{box-shadow:var(--hl),0 0 0 0 transparent,0 0 0 0 transparent}}
.qstrip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--fg);border:1px solid var(--border-strong);border-radius:var(--r);padding:5px 8px;background:var(--surface)}
.qstrip .qt{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 160px}
.segs .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin:6px 0 0;font-size:12px}
.detail-grid dt{color:var(--faint)}
.detail-grid dd{margin:0;color:var(--fg);font-family:var(--font-mono);overflow-wrap:anywhere}

/* ---------- background jobs ---------- */
.badge.live{background:var(--info)}
.pill.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent);background:var(--err-soft)}
.sp.err{color:var(--err)}
.bgn{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:var(--fw-semibold);color:var(--info);font-variant-numeric:tabular-nums;white-space:nowrap}
.bgn .ic{width:12px;height:12px}
button.bgn:hover{text-decoration:underline;text-underline-offset:2px}
.cs-bg{display:inline-flex;align-items:center;gap:7px;color:var(--fg)}
.cs-bg:hover{color:var(--fg-strong);text-decoration:underline;text-underline-offset:2px}
.job{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:9px 10px;display:flex;flex-direction:column;gap:7px;min-width:0}
.job.failed{border-color:color-mix(in srgb,var(--err) 45%,var(--border))}
.job.flash{animation:flash 1.4s ease-out}
.job-top{display:flex;align-items:center;gap:7px;min-width:0}
.job-top b{flex:1;min-width:0;color:var(--fg-strong);font-weight:var(--fw-semibold);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job-cmd{font-family:var(--font-mono);font-size:12px;color:var(--fg-strong);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job-meta{display:flex;align-items:center;gap:4px 12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);min-width:0}
.job-meta span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.job-meta .ic{width:12px;height:12px}
.job-out{font-family:var(--font-mono);font-size:11.5px;line-height:1.6;font-variant-ligatures:none;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:4px 8px;overflow:hidden}
.job-out div{white-space:pre;overflow:hidden;text-overflow:ellipsis}
.job-out div:last-child{color:var(--fg)}
.job-out div.e{color:var(--err)}
.job-out.tall{max-height:240px;overflow:auto}
.job-out.tall div{overflow:visible;min-width:max-content}

/* ---------- type & depth ---------- */
.md,.bubble,.br-t,.q,.mr-t,.mi-t,.plan-doc,.small,.tc-act{font-variant-numeric:normal}
.ch-tab,.sb-head h2,.p-head h2,.stat .v,.plan-doc h3,.wordmark{font-family:var(--font-display);letter-spacing:-.005em}
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.card,.composer,.stat,.arow,.brief,.job,.steps{box-shadow:var(--hl)}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- connection banner (C26): the one place a lost link is reported ---------- */
.connbar{flex:none;padding:10px 24px 0}
.connbar:empty{display:none}
.lb{max-width:792px;margin-inline:auto;border:1px solid color-mix(in srgb,var(--err) 38%,var(--border));border-left:3px solid var(--err);border-radius:var(--r);background:color-mix(in srgb,var(--err) 7%,var(--surface));box-shadow:var(--hl)}
.lb.in{animation:lbin .22s ease-out}
.lb.re{border-color:var(--border-strong);border-left-color:var(--accent);background:var(--surface)}
.lb-in{display:flex;align-items:center;gap:8px 12px;padding:9px 10px 9px 12px;flex-wrap:wrap}
.lb-ic{color:var(--err);display:grid;place-items:center;flex:none;width:16px}
.lb.re .lb-ic{color:var(--accent)}
.lb-txt{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:1px}
.lb-txt b{color:var(--fg-strong);font-size:13px}
.lb-sub{font-size:12.5px;color:var(--muted)}
.lb-retry{font-size:12px;color:var(--faint);white-space:nowrap}
.lb-act{display:flex;gap:6px;align-items:center;flex:none;margin-left:auto}
.lb-det{margin:0;padding:8px 12px 10px 40px;border-top:1px solid var(--border);display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;font-size:12px}
.lb-det dt{color:var(--faint)}
.lb-det dd{margin:0;color:var(--fg);font-family:var(--font-mono);overflow-wrap:anywhere}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes lbin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.chip.netsim.on{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,transparent);background:var(--err-soft)}
/* offline: every other element keeps its last known value and stops moving; no second error message */
.app.offline .sg.run,.app.offline .sg.wait,.app.offline .caret,.app.offline .lv::after{animation:none}
.app.offline .shine{animation:none;background:none;color:var(--fg)}
.app.offline .caret{opacity:.35}
.app.offline .conn{color:var(--faint)}
.app.offline .conn i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)}
.app.offline .statusbar .sbi:not(.conn),.app.offline .chathead .chip,.app.offline .cstats{opacity:.55}
.app.offline .p-body{opacity:.75}
.app.offline .countdown{color:var(--muted)}
.app.offline .deadline{background:var(--surface-3)}
.app.offline .deadline i{background:var(--muted);transition:none}
.app.offline [aria-disabled="true"],.app.offline .send{opacity:.45;cursor:not-allowed}
.asof{font-size:11.5px;color:var(--faint);white-space:nowrap}

/* ---------- run timeline (L1–L3) ---------- */
.rstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rstats .stat .v{font-size:16px}
.rstats .stat.need .v{color:var(--warn)}
.tl{display:flex;flex-direction:column;gap:1px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);padding:4px 6px 8px}
.tl-axis,.tl-row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:center}
.tl-axis{height:20px}
.tl-ticks{position:relative;height:100%;overflow:hidden}
.tl-ticks span{position:absolute;top:3px;transform:translateX(-50%);font:10.5px var(--font-mono);color:var(--faint);white-space:nowrap}
.tl-row{width:100%;text-align:left;padding:2px 0;border-radius:var(--r-sm)}
.tl-row:hover,.tl-row.sel{background:var(--surface-2)}
.tl-row.sel .tl-lab{color:var(--fg-strong);font-weight:var(--fw-medium)}
.tl-lab{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg);white-space:nowrap;overflow:hidden;padding-left:4px}
.tl-trk{position:relative;height:24px;margin-right:4px}
.tl-trk i{position:absolute;display:block}
.tl-trk .g{top:-2px;bottom:-2px;width:1px;background:var(--border)}
.tl-trk .now{top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--accent)}
.tl-trk .life{top:11px;height:2px;background:repeating-linear-gradient(90deg,var(--border-strong) 0 3px,transparent 3px 6px)}
.tl-trk .s{top:6px;height:12px;border-radius:3px;min-width:2px}
.tl-trk .n{top:20px;height:3px;border-radius:2px;background:var(--warn);min-width:2px}
.tl-trk .mk{top:8px;width:8px;height:8px;margin-left:-4px;transform:rotate(45deg);border-radius:1.5px;background:var(--info);box-shadow:0 0 0 2px var(--bg)}
.tl-trk .mk.steer{background:var(--fg-strong)}
.tl-trk .mk.mail{background:var(--muted)}
.tl-trk .mk.done{background:var(--ok)}
.k-model{background:var(--k-model)}
.k-tool{background:var(--k-tool)}
.k-wait{background:repeating-linear-gradient(135deg,var(--k-wait) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px var(--k-wait)}
.k-need{background:var(--warn)}
.lv{overflow:hidden}
.lv::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent) no-repeat;background-size:48px 100%;animation:sweep 1.6s linear infinite}
@keyframes sweep{from{background-position:-48px 0}to{background-position:calc(100% + 48px) 0}}
.tl-leg{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:8px 4px 0}
.tl-leg span{display:inline-flex;align-items:center;gap:6px}
.tl-leg i{display:inline-block;width:14px;height:8px;border-radius:2px;position:relative}
.tl-leg i.n{height:3px;background:var(--warn)}
.tl-leg i.mk{width:7px;height:7px;transform:rotate(45deg);background:var(--info);border-radius:1.5px}
.tl-leg i.nw{width:2px;height:12px;background:var(--accent)}
.steps{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:2px 10px 8px}
.steps.empty{padding:10px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.st-h{display:flex;align-items:center;gap:8px;padding:7px 0 5px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.st-h b{color:var(--fg-strong);font-size:13px}
.st-h .el{margin-left:auto;color:var(--fg)}
.step{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:3px 8px;align-items:center;padding:6px 0 4px;font-size:12.5px;border-top:1px solid var(--border)}
.step .ic{color:var(--muted)}
.step .sl{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .sl.mono{font-family:var(--font-mono);font-size:12px}
.step .sl.need{color:var(--warn)}
.step .sd{color:var(--muted);font-size:12px}
.step .sb{grid-column:2/-1;position:relative;height:4px;border-radius:2px;background:var(--surface-3)}
.step .sb i{position:absolute;top:0;bottom:0;border-radius:2px;min-width:3px}
.tip{position:fixed;z-index:80;max-width:290px;pointer-events:none;background:var(--surface-3);color:var(--fg);border:1px solid var(--border-strong);border-radius:var(--r-md);padding:6px 9px;font-size:12px;line-height:1.45;box-shadow:var(--shadow)}
.tip b{color:var(--fg-strong)}
.tip .tk{color:var(--muted);font-size:11.5px}
@media (max-width:860px){ .connbar{padding:8px 16px 0} }
@media (prefers-reduced-motion:reduce){ .lv::after{animation:none;background:none} .lb{animation:none} .spin{animation-duration:2.4s} }

/* ---------- wiring overlay (mockup only) ---------- */
.app.wiring [data-w]{outline:1px dashed color-mix(in srgb,var(--info) 65%,transparent);outline-offset:1px;cursor:help}
.app.wiring [data-w]:not(.badge):not(.sg){position:relative}
.app.wiring [data-w]::after{content:attr(data-w);position:absolute;top:1px;right:1px;z-index:6;font:600 9.5px/14px var(--font-mono);padding:0 4px;border-radius:4px;background:var(--wb,var(--info));color:#fff;pointer-events:none;letter-spacing:0;text-transform:none;font-style:normal}
.app.wiring .deadline[data-w]::after{top:5px;right:38px}
.app.wiring [data-ws="SV"]{--wb:#3f8a2e}
.app.wiring [data-ws="INF"]{--wb:#b4561f}
.app.wiring [data-ws="UNV"]{--wb:#9a6408}
.app.wiring [data-ws="CLIENT"],.app.wiring [data-ws="SAMPLE"]{--wb:#6c6259}
.wbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--fg);padding:6px 14px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.app.wiring .wbar{display:flex}
.wbar i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.wpop{position:fixed;right:60px;bottom:16px;z-index:70;width:min(480px,calc(100vw - 32px));max-height:72vh;overflow:auto;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.wp-h{display:flex;align-items:center;gap:8px}
.wp-h b{color:var(--fg-strong);font-size:14px}
.wid{font:600 12px var(--font-mono);color:#fff;background:var(--info);border-radius:5px;padding:1px 6px}
.wst{font:600 11px var(--font-mono);border-radius:5px;padding:1px 6px;border:1px solid var(--border-strong);color:var(--fg)}
.wp-k{font-size:12px;color:var(--muted)}
.wp-sec{display:flex;flex-direction:column;gap:2px}
.wp-sec>span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:var(--fw-semibold)}
.wp-sec div{color:var(--fg);line-height:1.55;overflow-wrap:anywhere}
.wp-sec code{font-size:12px;color:var(--code);background:var(--bg);padding:0 4px;border-radius:4px}
.wp-ev{display:flex;gap:4px;flex-wrap:wrap}
.wp-ev code{font-size:11.5px}
.wp-refs{display:flex;flex-direction:column;gap:2px;font-size:12px}
.wp-refs a{color:var(--link);font-family:var(--font-mono);font-size:11.5px;overflow-wrap:anywhere}
.wlink{font:600 12px var(--font-mono);color:var(--info);text-decoration:underline;text-underline-offset:2px}
@media (max-width:860px){ .wpop{right:16px;left:16px;width:auto} }
</style>
</head>
