      if(state.stopArm===a){
        const js=runningJobs(a); js.forEach(j=>endJob(j,'cancelled',null,true));
        AG[a].status='cancelled'; AG[a].act='Stopped by you (abort + disconnect). Its tasks returned to pending.'; TASKS.filter(t=>t.owner===a&&t.st==='in_progress').forEach(t=>t.st='pending'); state.stopArm=null; logEvent('harness','agent_status',`${a} · cancelled`);
        toast(`${a} stopped${js.length?` · ${js.length} background job${js.length>1?'s':''} cancelled`:''}`); }
      else { state.stopArm=a; toast(`Click Stop again to stop ${a}`); }
      renderAll(true); break;
    case 'panel': state.panel=el.dataset.tab; state.panelOpen=true; state.sideOpen=false; renderAll(true); break;
    case 'rail': if(state.panelOpen&&state.panel===el.dataset.tab) state.panelOpen=false; else { state.panel=el.dataset.tab; state.panelOpen=true; } renderAll(true); break;
    case 'close-panel': state.panelOpen=false; renderAll(true); break;
    case 'side': state.sideOpen=true; renderAll(true); break;
    case 'close-overlays': state.sideOpen=false; renderAll(true); break;
    case 'taskview': state.taskView=el.dataset.v; renderPanel(true); break;
    case 'task': state.taskView='list'; renderPanel(false); break;
    case 'mailf': state.mailFilter=el.dataset.v; renderPanel(true); break;
    case 'toggle': state.openCards[el.dataset.card]=!state.openCards[el.dataset.card]; renderThread(true); break;
    case 'menu': state.menu=!state.menu; renderComposer(); break;
    case 'target': state.target=a; state.menu=false; renderComposer(); $('#input').focus(); break;
    case 'send': send(); break;
    case 'sendnow': { const m=mail(el.dataset.id); if(m&&m.state==='submitted'){ m.state='in_context'; m.delivery='steering'; m.seq=logEvent(m.to,'user.message','delivery: steering (queue.send_now)'); renderAll(true);} break; }
    case 'retract': { const m=mail(el.dataset.id); if(m&&m.state==='submitted'){ m.state='withdrawn'; m.seq=logEvent('harness','mail_state',`${m.id} · withdrawn (queue.withdraw_message)`); renderAll(true);} break; }

    case 'reply-open': $('#replyBox').hidden=false; $('#replyInput').focus(); break;
    case 'reply-send': { const v=$('#replyInput').value.trim(); if(v) answer(v); break; }
    case 'plan-approve': PLAN.v2.state='approved'; PLAN.v2.decidedAt=now(); tk('T7').st='pending'; tk('T6').deps.push('T7'); logEvent('orchestrator','plan_decided','v2 approved · T7 created · T6 rewired'); toast('Plan v2 approved · T7 added to the board'); renderAll(true); break;
    case 'plan-reject': PLAN.v2.state='rejected'; PLAN.v2.decidedAt=now(); tk('T7').st='cancelled'; logEvent('orchestrator','plan_decided','v2 rejected'); renderAll(true); break;
    case 'perm': permDecide(el.dataset.v); break;
    case 'jstop': {
      const j=job(el.dataset.job); if(!j||!['running','idle'].includes(j.st)) break;
      if(state.jobArm===j.id){ state.jobArm=null; endJob(j,'cancelled',null); toast(`${j.id} stopped · ${j.agent} was told`); }
      else { state.jobArm=j.id; toast(`Click Stop again to stop ${j.id}`); }
      renderAll(true); break; }
    case 'jout': state.openJobs[el.dataset.job]=!state.openJobs[el.dataset.job]; renderPanel(true); break;
    case 'jopen': {
      const id=el.dataset.job; state.panel='bg'; state.panelOpen=true; state.openJobs[id]=true; renderAll(true);
      const c=document.getElementById('job-'+id); if(c){ c.scrollIntoView({block:'nearest'}); c.classList.add('flash'); setTimeout(()=>c.classList.remove('flash'),1500); }
      break; }
    case 'jclear': {
      const fin=JOBS.filter(j=>!j.cleared&&!['running','idle'].includes(j.st)); fin.forEach(j=>j.cleared=true);
      logEvent('harness','bg_job_removed',`session.tasks.remove × ${fin.length}`); toast(`Cleared ${fin.length} finished job${fin.length>1?'s':''}; output stays in the run log`); renderPanel(true); break; }
    case 'jump': {
      state.view='orchestrator'; state.target='orchestrator'; renderAll(false);
      const c=document.querySelector('#thread [data-needs]'); if(c){ c.scrollIntoView({block:'center'}); c.classList.add('flash'); setTimeout(()=>c.classList.remove('flash'),1500); }
      break; }
    case 'wiring': state.wiring=!state.wiring; if(!state.wiring) $('#wpop').hidden=true; else toast('Wiring on: click any labelled element'); renderAll(true); break;
    case 'theme': document.documentElement.dataset.theme = isDark()?'light':'dark'; renderTop(); break;
    case 'older': toast('Loads 200 older events from the harness log'); break;
    case 'demo': toast('Placeholder in this mockup'); break;
  }
});
document.addEventListener('change',e=>{ if(e.target.id==='steerToggle'){ state.steer=e.target.checked; renderComposer(); } });
document.addEventListener('keydown',e=>{
  if(e.target.id==='input' && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  if(e.target.id==='replyInput' && e.key==='Enter'){ const v=e.target.value.trim(); if(v) answer(v); }
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role="button"][data-act]') && e.target.tagName!=='BUTTON'){ e.preventDefault(); e.target.click(); }
  if(e.key==='Escape'){ state.menu=false; state.sideOpen=false; $('#wpop').hidden=true; renderComposer(); app.classList.remove('side-open'); }
  if(e.altKey && e.key==='Enter' && PERMS.p1.state==='open'){ e.preventDefault(); permDecide('once'); }
});

/* ======================= live simulation ======================= */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function finishStream(){ const A=AG['coder-1']; A.step=[5,7]; A.act='Spawning the JWKS refresh task'; SCRATCH['coder-1'][3][1]=1; SCRATCH['coder-1'][4][1]=2; }
function streamTick(){
  const b=T['coder-1'].find(x=>x.t==='stream'); if(!b||b.text.length>=b.full.length) return false;
  const nx=b.full.indexOf(' ', b.text.length+1); b.text = nx<0 ? b.full : b.full.slice(0,nx);
  const el=document.getElementById('streamText'); if(el) el.textContent=b.text;
  if(b.text.length>=b.full.length){ finishStream(); logEvent('coder-1','assistant.message','final text · message_id 9f1e…'); renderAll(true); return false; }
  return true;
}
if(reduce){ const b=T['coder-1'].find(x=>x.t==='stream'); b.text=b.full; finishStream(); }
else { const st=setInterval(()=>{ if(!streamTick()) clearInterval(st); },140); }
setInterval(()=>{
  const s=SAMPLE[state.si++%SAMPLE.length]; logEvent(s[0],s[1],s[2]);
  if(state.panelOpen&&state.panel==='log'){ state.newRow=!reduce; renderPanel(true); state.newRow=false; }
},2000);
setInterval(()=>{
  const p=PERMS.p1; if(p.state!=='open') return;
  p.left=Math.max(0,p.left-1);
  const el=document.getElementById('permCountdown');
  if(el) el.lastChild.nodeValue=`auto-denies in ${Math.floor(p.left/60)}:${String(p.left%60).padStart(2,'0')}`;
  if(p.left===0){ p.state='timed_out'; const A=AG['coder-2']; A.status='idle'; A.act='Told to wait for your approval (auto-denied after 90 s)'; logEvent('harness','permission','p1 · auto-denied after 90 s · reject(feedback)'); renderAll(true); }
},1000);

/* background jobs: elapsed clocks, tool.shell_output chunks, the coder-2 build finishing */
const IDP_REQ=['GET /oauth2/v1/keys 200 1ms','GET /.well-known/openid-configuration 200 2ms','GET /oauth2/v1/keys 304 0ms','POST /oauth2/v1/token 200 4ms'];
const CRATES=['hyper-util v0.1.9','oauth2 v4.4.2','wiremock v0.6.2','tower v0.5.1','reqwest v0.12.8','auth v0.4.0 (wt/coder-2/crates/auth)'];
setInterval(()=>{
  const k=++state.bgTicks;
  JOBS.forEach(j=>{ if(['running','idle'].includes(j.st)) j.t++; });
  const idp=job('j3'), watch=job('j4'), build=job('j5');
  if(idp.st==='running' && k%5===0) bgOut(idp,[`${simClock(true)} ${IDP_REQ[(k/5)%IDP_REQ.length]}`]);
  if(watch.st==='running' && k%11===6) bgOut(watch,["[Running 'cargo check -p auth']",'    Checking auth v0.4.0 (wt/coder-1/crates/auth)',`    Finished \`dev\` profile [unoptimized + debuginfo] target(s) in ${(2+Math.random()*1.5).toFixed(2)}s`,'[Finished running. Exit status: 0]']);
  if(build.st==='running'){
    build.prog[0]=Math.min(build.prog[1],build.prog[0]+4);
    const p=build.prog, w=22, f=Math.round(p[0]/p[1]*w);
    const bar=`    Building [${'='.repeat(Math.max(0,f-1))}>${' '.repeat(w-f)}] ${p[0]}/${p[1]}: auth(test), ${CRATES[k%CRATES.length].split(' ')[0]}`;
    if(k%3===0) { build.out.pop(); bgOut(build,[`   Compiling ${CRATES[(k/3)%CRATES.length]}`,bar]); } else bgOut(build,[bar],true);
    if(p[0]>=p[1]){
      bgOut(build,[`    Finished \`test\` profile [unoptimized + debuginfo] target(s) in ${fdur(build.t)}`],true);
      endJob(build,'completed',0);
      toast(`coder-2’s ${build.id} finished · cargo build exited 0`); renderAll(true); return;
    }
  }
  paintJobs();
},1000);

state.panelOpen=!narrow();
renderAll(false);
</script>
