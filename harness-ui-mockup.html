<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multi-Agent Harness Console</title>
<style>
/* Layout: OpenChamber-style shell. Session sidebar | chat column | context panel + icon rail.
   Dark-first (OpenChamber default dark), light theme mirrors it. */
:root{
  color-scheme: dark;
  --bg:#120f0e; --surface:#171413; --surface-2:#1e1a18; --surface-3:#28221f;
  --border:#2a2421; --border-strong:#3b332e;
  --fg:#d3cdc2; --fg-strong:#efe9df; --muted:#8e867b; --faint:#6a6158;
  --accent:#da7c47; --accent-hover:#eb8c57; --accent-soft:#2d1c12; --on-accent:#1b0f08;
  --user-bubble:#2d1c12; --user-fg:#eadccb;
  --ok:#76ad4f; --warn:#d0902c; --err:#da5b4a; --info:#479fe6;
  --ok-soft:rgba(118,173,79,.13); --warn-soft:rgba(208,144,44,.12); --err-soft:rgba(218,91,74,.13); --info-soft:rgba(71,159,230,.12);
  --code:#8cc265; --link:#6fa9b9;
  --a-orch:#da7c47; --a-explorer:#5fa8b8; --a-coder1:#6aa5e8; --a-coder2:#a98be0; --a-tester:#d47fa6; --a-reviewer:#c9b27a;
  --shadow:0 12px 36px rgba(0,0,0,.5);
  --font-ui:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono:ui-monospace, "Cascadia Code", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
  --r:9px; --r-md:7px; --r-sm:4px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#f8f4ee; --surface:#f1ebe2; --surface-2:#fffcf8; --surface-3:#e8e0d4;
    --border:#e2d9cc; --border-strong:#cfc3b3;
    --fg:#3b322b; --fg-strong:#1f1914; --muted:#786c61; --faint:#a19486;
    --accent:#c4602a; --accent-hover:#ad5020; --accent-soft:#f5e1d1; --on-accent:#ffffff;
    --user-bubble:#f2dfcd; --user-fg:#3a2618;
    --ok:#3c8a2b; --warn:#a0650a; --err:#bf412e; --info:#2a70bb;
    --ok-soft:rgba(60,138,43,.11); --warn-soft:rgba(160,101,10,.10); --err-soft:rgba(191,65,46,.10); --info-soft:rgba(42,112,187,.10);
    --code:#3b7d26; --link:#2d6f84;
    --a-orch:#c4602a; --a-explorer:#2d8596; --a-coder1:#2f6fb8; --a-coder2:#7353b8; --a-tester:#ad4b7a; --a-reviewer:#8a7340;
    --shadow:0 12px 36px rgba(70,45,20,.16);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f8f4ee; --surface:#f1ebe2; --surface-2:#fffcf8; --surface-3:#e8e0d4;
  --border:#e2d9cc; --border-strong:#cfc3b3;
  --fg:#3b322b; --fg-strong:#1f1914; --muted:#786c61; --faint:#a19486;
  --accent:#c4602a; --accent-hover:#ad5020; --accent-soft:#f5e1d1; --on-accent:#ffffff;
  --user-bubble:#f2dfcd; --user-fg:#3a2618;
  --ok:#3c8a2b; --warn:#a0650a; --err:#bf412e; --info:#2a70bb;
  --ok-soft:rgba(60,138,43,.11); --warn-soft:rgba(160,101,10,.10); --err-soft:rgba(191,65,46,.10); --info-soft:rgba(42,112,187,.10);
  --code:#3b7d26; --link:#2d6f84;
  --a-orch:#c4602a; --a-explorer:#2d8596; --a-coder1:#2f6fb8; --a-coder2:#7353b8; --a-tester:#ad4b7a; --a-reviewer:#8a7340;
  --shadow:0 12px 36px rgba(70,45,20,.16);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
code,.mono{font-family:var(--font-mono)}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:14px;height:14px}.ic.xs{width:11px;height:11px;stroke-width:2.4}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.spacer{flex:1}
.ibtn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:var(--r-md);color:var(--muted);flex:none}
.ibtn:hover{background:var(--surface-3);color:var(--fg)}
.mobile-only{display:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;min-width:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding-inline:14px 10px;border-bottom:1px solid var(--border);min-width:0}
.work{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 44px;min-height:0}
.app.panel-open .work{grid-template-columns:minmax(0,1fr) 368px 44px}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.scroll{flex:1;overflow-y:auto;min-height:0;scroll-behavior:auto}
.thread{max-width:840px;margin-inline:auto;padding:22px 24px 18px;display:flex;flex-direction:column;gap:18px}
.panel{display:none;border-left:1px solid var(--border);background:var(--surface);flex-direction:column;min-height:0;min-width:0}
.app.panel-open .panel{display:flex}
.rail{border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:4px;padding-block:8px}
.scrim{display:none}

/* ---------- sidebar ---------- */
.sb-top{height:48px;flex:none;display:flex;align-items:center;gap:9px;padding-inline:14px 8px;border-bottom:1px solid var(--border)}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.logo .ic{width:13px;height:13px;stroke-width:2.4}
.wordmark{font-weight:600;color:var(--fg-strong);letter-spacing:.01em}
.sb-new{margin:10px 8px 2px;display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:var(--r-md);color:var(--fg);font-weight:500}
.sb-new:hover{background:var(--surface-3)}
.sb-tools{display:flex;gap:2px;padding:0 8px 6px}
.sb-scroll{flex:1;overflow:auto;padding:2px 8px 12px;min-height:0}
.sb-gh{display:flex;align-items:center;gap:8px;padding:12px 8px 4px;font-weight:600;color:var(--fg-strong);font-size:13px}
.sb-gh .ic{color:var(--muted)}
.sb-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px 6px 32px;border-radius:var(--r-md);color:var(--fg);white-space:nowrap;min-width:0}
.sb-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sb-row .meta{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.sb-row:hover{background:var(--surface-3)}
.sb-row.active{background:var(--accent-soft);color:var(--accent)}
.sb-row.active .meta{color:var(--accent)}
.sb-row .chev{margin-left:-22px;color:var(--muted)}
.sb-kids{margin:2px 0 4px 21px;padding-left:6px;border-left:1px solid var(--border-strong);display:flex;flex-direction:column;gap:1px}
.sb-agent{padding:4px 8px 4px 10px;font-size:12.5px;gap:8px}
.sb-agent.sel{background:var(--surface-3);color:var(--fg-strong)}
.sb-more{padding:4px 8px 4px 32px;font-size:12px;color:var(--faint)}
.sb-wt{padding-left:12px}
.sb-wt .ic{color:var(--muted)}
.sb-foot{flex:none;border-top:1px solid var(--border);padding:8px 10px;display:flex;align-items:center;gap:4px}
.conn{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ---------- topbar ---------- */
.tb-title{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.tb-line{display:flex;align-items:center;gap:6px;min-width:0;font-size:14px;color:var(--fg-strong);font-weight:600;white-space:nowrap}
.tb-line .crumb{font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.tb-line .crumb:hover{color:var(--fg)}
.tb-line .cur{overflow:hidden;text-overflow:ellipsis}
.tb-sub{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
.tb-sub .ic{width:12px;height:12px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--fg);white-space:nowrap;background:transparent}
button.chip:hover{border-color:var(--border-strong);background:var(--surface-2)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn);background:var(--warn-soft)}
.ring{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums}
.ring svg{width:18px;height:18px;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:var(--surface-3);stroke-width:3}
.ring .fgc{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round}
.ring .fgc.hot{stroke:var(--warn)}

/* ---------- status glyphs & pills ---------- */
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,var(--muted))}
.sg{width:12px;height:12px;flex:none;display:inline-grid;place-items:center;border-radius:50%;font-size:9px;font-weight:800;line-height:1;position:relative}
.sg.run{border:2px solid var(--info);border-right-color:transparent;animation:spin 1s linear infinite}
.sg.wait{border:2px dotted var(--accent);animation:spin 4s linear infinite}
.sg.need{background:var(--warn);color:var(--bg)}
.sg.idle{border:1.5px solid var(--faint)}
.sg.done{background:var(--ok);color:var(--bg)}
.sg.block{border:1.5px solid var(--faint)}
.sg.block::after{content:"";position:absolute;width:9px;height:1.5px;background:var(--faint);transform:rotate(-45deg)}
.sg.prop{border:1.5px dashed var(--accent)}
.sg.err{background:var(--err)}
@keyframes spin{to{transform:rotate(360deg)}}
.sp{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sp.warn{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.pill.role{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.tid{font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-3);border-radius:var(--r-sm);padding:0 5px;line-height:18px;white-space:nowrap}
.kind{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:0 6px;border-radius:var(--r-sm);line-height:17px;border:1px solid var(--border-strong);color:var(--muted)}
.kind.question{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.kind.steer{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.kind.answer{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}

/* ---------- buttons ---------- */
.btn{height:28px;padding:0 11px;border-radius:var(--r-md);border:1px solid var(--border-strong);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--fg);background:var(--surface-2)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--err)}
.btn.xs{height:24px;padding:0 8px;font-size:12px}
.btn kbd,.kbd{font-family:var(--font-mono);font-size:10.5px;opacity:.7;font-weight:400}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btns.end{justify-content:flex-end}

/* ---------- messages ---------- */
.older{align-self:center;display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);border:1px dashed var(--border-strong);border-radius:999px;padding:4px 12px}
.older:hover{color:var(--fg)}
.msg-user{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bubble{max-width:min(580px,88%);background:var(--user-bubble);color:var(--user-fg);padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55}
.to-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.msg-time{font-size:11.5px;color:var(--faint);display:flex;gap:6px;align-items:center}
.msg-time .ok{color:var(--ok)}
.msg-asst{display:flex;flex-direction:column;gap:8px;min-width:0}
.ah{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.ah b{color:var(--fg-strong);font-weight:600}
.think{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:baseline;min-width:0}
.think b{color:var(--fg);font-weight:500;flex:none}
.think span{font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.acts{border-left:1px solid var(--border-strong);margin-left:5px;padding-left:14px;display:flex;flex-direction:column}
.acts-h{font-size:12px;color:var(--faint);margin-bottom:2px}
.act{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:23px;min-width:0}
.act .ic{color:var(--muted)}
.act b{font-weight:500;color:var(--fg);flex:none}
.act .arg{color:var(--muted);font-family:var(--font-mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.act .dur{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px;flex:none}
.md{line-height:1.65;font-size:14px;color:var(--fg);min-width:0;overflow-wrap:anywhere}
.md p{margin:0 0 6px}.md p:last-child{margin-bottom:0}
.md ul{margin:4px 0 0;padding-left:20px}
.md li{margin:2px 0}
.md b{color:var(--fg-strong);font-weight:600}
.md code,.q code,.br-t code{font-size:12.5px;color:var(--code);background:var(--surface-2);padding:1px 5px;border-radius:var(--r-sm)}
.ameta{display:flex;gap:14px;color:var(--faint);font-size:12px;flex-wrap:wrap}
.ameta span{display:inline-flex;align-items:center;gap:5px}
.caret{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- cards ---------- */
.card{border:1px solid var(--border);background:var(--surface);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;flex-wrap:wrap;min-width:0}
.card-h b{color:var(--fg-strong);font-weight:600}
button.card-h{width:100%;text-align:left}
.card-b{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.needs{border-color:color-mix(in srgb,var(--warn) 55%,var(--border))}
.card.accent{border-color:color-mix(in srgb,var(--accent) 60%,var(--border))}
.card.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.q{margin:0;font-size:14px;color:var(--fg-strong);line-height:1.55}
.small{font-size:12.5px;margin:0}
.reply{display:flex;gap:8px}
.reply input{flex:1;min-width:0;height:30px;border-radius:var(--r-md);border:1px solid var(--border-strong);background:var(--bg);padding:0 10px;outline:0}
.reply input:focus{border-color:var(--accent)}
.resolved{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.resolved b{color:var(--fg)}

/* task (subagent) card */
.tcard .card-h{padding-bottom:6px}
.tc-kind{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tc-title{color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 140px}
.tc-act{font-size:13px;color:var(--fg)}
.shine{background:linear-gradient(90deg,var(--muted) 0%,var(--fg-strong) 45%,var(--muted) 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.6s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--muted));border-radius:2px}
.tc-meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tc-meta span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tc-meta .ic{width:12px;height:12px}
.report{font-size:13px;color:var(--fg);border-top:1px solid var(--border);padding-top:10px}

/* plan */
.ptasks{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.ptask{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 10px;font-size:12.5px;border-top:1px solid var(--border);background:var(--surface-2)}
.ptask:first-child{border-top:0}
.ptask .pt-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.ptask .pt-own{display:inline-flex;gap:6px;align-items:center;color:var(--muted);white-space:nowrap}
.ptask .pt-dep{color:var(--faint);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ptask.add{background:var(--ok-soft)}
.ptask.add .pt-title{color:var(--fg-strong)}
.ptask .mark{font-family:var(--font-mono);font-weight:700;width:10px;color:var(--faint)}
.ptask.add .mark{color:var(--ok)}

/* inline mail, brief, scratch, diff */
.mail-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:9px 12px;border-radius:var(--r);border:1px dashed var(--border-strong)}
.mail-row>.ic{color:var(--muted);margin-top:2px}
.mr-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.mr-h b{color:var(--fg);font-weight:500}
.mr-t{color:var(--fg);margin-top:2px;overflow-wrap:anywhere}
.brief{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.br-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.br-h b{color:var(--fg-strong);font-weight:600}
.br-t{font-size:14px;line-height:1.6;color:var(--fg)}
.br-m{font-size:12px;color:var(--faint);display:flex;gap:6px 14px;flex-wrap:wrap}
.scratch{border:1px solid var(--border);border-radius:var(--r);padding:8px 12px 10px;background:var(--surface)}
.sc-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.sc-h b{color:var(--fg);font-weight:600}
.scratch ul{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 16px}
.scratch li{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--fg)}
.scratch li.d{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.cb{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--faint);flex:none;display:grid;place-items:center}
.cb.d{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.cb.p{border-color:var(--info);background:linear-gradient(90deg,var(--info) 50%,transparent 50%)}
.diff{font-family:var(--font-mono);font-size:12px;line-height:1.65;overflow-x:auto;background:var(--bg);border-top:1px solid var(--border);border-radius:0 0 var(--r) var(--r);padding:4px 0}
.diff div{white-space:pre;display:flex;min-width:max-content}
.diff .ln{width:40px;flex:none;text-align:right;padding-right:10px;color:var(--faint);user-select:none}
.diff .sg2{width:14px;flex:none;color:var(--faint)}
.diff .a{background:var(--ok-soft)}.diff .a .sg2{color:var(--ok)}
.diff .r{background:var(--err-soft)}.diff .r .sg2{color:var(--err)}
.diff .h{color:var(--info)}
.plus{color:var(--ok);font-variant-numeric:tabular-nums}.minus{color:var(--err);font-variant-numeric:tabular-nums}
.cmd{font-family:var(--font-mono);font-size:12.5px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 10px;overflow-x:auto;white-space:pre;color:var(--fg-strong)}
details{font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer;width:max-content}
details dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:6px 0 0}
details dt{color:var(--faint)} details dd{margin:0;color:var(--fg);font-family:var(--font-mono);font-size:12px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border-strong)}
.divider .dv{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px}
.divider .dv b{color:var(--fg);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.idle-note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;padding:4px 2px}
.statusline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:2px}

/* ---------- composer ---------- */
.composer-wrap{flex:none;padding:0 24px 14px}
.cw-inner{max-width:792px;margin-inline:auto;display:flex;flex-direction:column;gap:7px;position:relative}
.cstrip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;padding-inline:2px}
.cstrip .ic{color:var(--accent)}
.composer{border:1px solid var(--border-strong);border-radius:12px;background:var(--surface);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 65%,var(--border))}
.c-to{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);min-height:26px}
.to-btn{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 9px;border-radius:999px;background:var(--surface-3);color:var(--fg);font-weight:500}
.to-btn:hover{background:var(--border-strong)}
.to-hint{display:inline-flex;align-items:center;gap:6px}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--fg)}
.toggle input{accent-color:var(--accent);margin:0}
textarea#input{width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--fg-strong);font:14px/1.5 var(--font-ui);min-height:46px;max-height:180px;padding:4px 2px}
textarea#input::placeholder{color:var(--faint)}
.c-bar{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.c-bar .chip{height:26px;border-color:transparent;color:var(--muted)}
.c-bar button.chip:hover{color:var(--fg)}
.c-bar .chip.on{color:var(--accent)}
.send{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.send:hover{background:var(--accent-hover)}
.menu{position:absolute;bottom:calc(100% - 34px);left:0;z-index:20;width:300px;max-width:100%;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:1px}
.menu-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:4px 8px;font-weight:600}
.menu button{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-md);text-align:left;font-size:13px}
.menu button:hover,.menu button.on{background:var(--surface-3)}
.menu button .sp{margin-left:auto}

/* ---------- panel ---------- */
.p-head{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;border-bottom:1px solid var(--border)}
.p-head h2{font-size:13.5px;font-weight:600;margin:0;color:var(--fg-strong);display:flex;align-items:center;gap:8px}
.p-head h2 .ic{color:var(--muted)}
.p-tabs-m{display:none;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border);overflow-x:auto;flex:none}
.p-tabs-m button{padding:4px 10px;border-radius:999px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.p-tabs-m button.on{background:var(--accent-soft);color:var(--accent)}
.p-body{flex:1;overflow:auto;padding:12px 14px 22px;display:flex;flex-direction:column;gap:10px;min-height:0}
.p-h{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:8px 0 0;display:flex;align-items:center;gap:8px}
.p-h:first-child{margin-top:0}
.p-h .spacer+button{text-transform:none;letter-spacing:0;font-weight:500}
.p-note{font-size:12px;color:var(--faint);margin:-4px 0 0}
.summary{display:flex;gap:6px;flex-wrap:wrap}
.arow{padding:9px 10px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface-2);display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.arow:hover{border-color:var(--border-strong)}
.arow.sel{border-color:color-mix(in srgb,var(--accent) 60%,var(--border))}
.ar-top{display:flex;align-items:center;gap:7px;min-width:0}
.ar-top b{color:var(--fg-strong);font-weight:600;font-size:13px}
.ar-top .sp{margin-left:auto}
.ar-act{font-size:12.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar-meta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);min-width:0}
.ar-meta .m{flex:1;min-width:60px}
.ar-meta span{white-space:nowrap;font-variant-numeric:tabular-nums}
.ar-btns{display:flex;gap:2px;margin-left:auto}
.ar-btns .ibtn{width:26px;height:26px}
.meter{position:relative;height:6px;border-radius:3px;background:var(--surface-3)}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--muted)}
.meter i.hot{background:var(--warn)}
.meter .tick{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--fg-strong);opacity:.55}
.trow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px;padding:5px 2px;border-bottom:1px solid var(--border)}
.trow:last-child{border-bottom:0}
.trow .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.trow .own{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-md);padding:2px;gap:2px}
.seg button{padding:2px 9px;border-radius:5px;font-size:12px;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.seg button.on{background:var(--surface-3);color:var(--fg-strong)}
.graph{border:1px solid var(--border);border-radius:var(--r);background:var(--bg);padding:6px;overflow-x:auto}
.graph svg{display:block;width:100%;min-width:300px;height:auto}
.g-edge{fill:none;stroke:var(--border-strong);stroke-width:1.5}
.g-edge.prop{stroke:var(--accent);stroke-dasharray:4 3}
.g-node{cursor:pointer}
.g-node rect{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.25}
.g-node.done rect{stroke:var(--ok)}
.g-node.in_progress rect{stroke:var(--info);stroke-width:1.75}
.g-node.proposed rect{stroke:var(--accent);stroke-dasharray:4 3}
.g-node .gid{fill:var(--muted);font:600 11px var(--font-mono)}
.g-node .gt{fill:var(--fg);font:500 11.5px var(--font-ui)}
.g-node .go{fill:var(--muted);font:11px var(--font-ui)}
.g-node:hover rect{fill:var(--surface-3)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.tcol{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:2px 10px}
.tdet{font-size:12px;color:var(--muted);grid-column:3/-1;margin-top:-2px}
.plan-doc{font-size:13px;line-height:1.6;color:var(--fg);display:flex;flex-direction:column;gap:8px}
.plan-doc h3{margin:0;font-size:15px;color:var(--fg-strong)}
.plan-doc h4{margin:4px 0 0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.plan-doc ul{margin:0;padding-left:18px}
.plan-doc .file{font-family:var(--font-mono);font-size:11.5px;color:var(--faint)}
.vers{display:flex;flex-direction:column;gap:6px}
.ver{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{padding:3px 10px;border-radius:999px;font-size:12px;color:var(--muted);border:1px solid var(--border)}
.filters button.on{color:var(--fg-strong);border-color:var(--border-strong);background:var(--surface-3)}
.mitem{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:9px 10px;display:flex;flex-direction:column;gap:5px}
.mi-h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mi-h b{color:var(--fg);font-weight:500}
.mi-t{font-size:13px;color:var(--fg);overflow-wrap:anywhere}
.mi-f{font-size:11.5px;color:var(--faint);display:flex;gap:6px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;background:var(--surface-2);min-width:0}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:17px;font-weight:600;color:var(--fg-strong);font-variant-numeric:tabular-nums;line-height:1.3}
.stat .s{font-size:11.5px;color:var(--faint)}
.mrow{display:grid;grid-template-columns:92px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:12px}
.mrow .lab{display:flex;align-items:center;gap:6px;color:var(--fg);white-space:nowrap;overflow:hidden}
.mrow .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.segs{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.segs div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding:6px 10px;font-size:12px;border-top:1px solid var(--border);background:var(--surface-2)}
.segs div:first-child{border-top:0}
.segs .n{font-family:var(--font-mono);color:var(--fg)}
.segs .z{color:var(--muted);font-variant-numeric:tabular-nums}
.tail{font-family:var(--font-mono);font-size:11.5px;line-height:1.75;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);padding:6px 0;overflow-x:auto}
.tail div{display:grid;grid-template-columns:40px 84px 196px minmax(120px,1fr);gap:8px;padding:0 10px;white-space:nowrap;min-width:max-content}
.tail div.new{animation:newrow 1.2s ease-out}
@keyframes newrow{from{background:var(--accent-soft)}to{background:transparent}}
.tail .s1{color:var(--faint);text-align:right}
.tail .s2{overflow:hidden;text-overflow:ellipsis}
.tail .s3{color:var(--fg)}
.tail .s4{color:var(--muted)}
.wt{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.wt-h{display:flex;align-items:center;gap:7px;font-size:12.5px}
.wt-h b{font-family:var(--font-mono);font-weight:500;color:var(--fg-strong);font-size:12px}
.wt-f{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;font-size:12px;align-items:center}
.wt-f .p{font-family:var(--font-mono);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt-f .st{font-family:var(--font-mono);font-weight:700;width:12px}

/* rail */
.rbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);position:relative}
.rbtn:hover{background:var(--surface-3);color:var(--fg)}
.rbtn.on{color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:2px;right:2px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--warn);color:var(--bg);font-size:9.5px;font-weight:700;display:grid;place-items:center;line-height:1}
.rail .sep{width:20px;height:1px;background:var(--border);margin:4px 0}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface-3);color:var(--fg-strong);border:1px solid var(--border-strong);padding:8px 14px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);z-index:60;max-width:calc(100vw - 32px)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .tb-right .chip.bgchip{display:none}
  .app.panel-open .work{grid-template-columns:minmax(0,1fr) 44px}
  .panel{position:fixed;top:48px;right:44px;bottom:0;width:min(380px,calc(100vw - 60px));z-index:30;box-shadow:var(--shadow)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);z-index:45;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .app.side-open .sidebar{transform:none}
  .work,.app.panel-open .work{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .panel{right:0;left:0;width:auto;top:48px}
  .p-tabs-m{display:flex}
  .mobile-only{display:inline-grid}
  .hide-m{display:none!important}
  .thread{padding:16px 16px 12px}
  .composer-wrap{padding:0 16px 12px}
  .app.side-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
  .tail div{grid-template-columns:40px 84px 180px minmax(120px,1fr)}
}
@media (max-width:560px){
  .tb-right .chip.ctxchip,.tb-right .chip.byok,.tb-right .chip.bgchip{display:none}
  .ptask{grid-template-columns:auto auto minmax(0,1fr);}
  .ptask .pt-dep,.ptask .pt-own{grid-column:3}
  .stats{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .shine{animation:none;background:none;color:var(--fg)}
  .sg.run,.sg.wait,.caret,.tail div.new,.card.flash{animation:none}
  .sidebar{transition:none}
}

/* ---------- additions: rotation, countdown, queue strip, gen chip ---------- */
.gen{font-family:var(--font-mono);font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:var(--r-sm);padding:0 5px;line-height:17px;white-space:nowrap}
.countdown{font-size:12px;color:var(--warn);font-variant-numeric:tabular-nums;display:inline-flex;gap:6px;align-items:center}
.qstrip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--fg);border:1px solid var(--border-strong);border-radius:var(--r);padding:5px 8px;background:var(--surface)}
.qstrip .qt{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 160px}
.segs .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin:6px 0 0;font-size:12px}
.detail-grid dt{color:var(--faint)}
.detail-grid dd{margin:0;color:var(--fg);font-family:var(--font-mono);overflow-wrap:anywhere}

/* ---------- background jobs ---------- */
.badge.live{background:var(--info)}
.pill.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent);background:var(--err-soft)}
.sp.err{color:var(--err)}
.bgn{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--info);font-variant-numeric:tabular-nums;white-space:nowrap}
.bgn .ic{width:12px;height:12px}
button.bgn:hover{text-decoration:underline;text-underline-offset:2px}
.cs-bg{display:inline-flex;align-items:center;gap:7px;color:var(--fg)}
.cs-bg:hover{color:var(--fg-strong);text-decoration:underline;text-underline-offset:2px}
.job{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:9px 10px;display:flex;flex-direction:column;gap:7px;min-width:0}
.job.failed{border-color:color-mix(in srgb,var(--err) 45%,var(--border))}
.job.flash{animation:flash 1.4s ease-out}
.job-top{display:flex;align-items:center;gap:7px;min-width:0}
.job-top b{flex:1;min-width:0;color:var(--fg-strong);font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job-cmd{font-family:var(--font-mono);font-size:12px;color:var(--fg-strong);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job-meta{display:flex;align-items:center;gap:4px 12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);min-width:0}
.job-meta span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.job-meta .ic{width:12px;height:12px}
.job-out{font-family:var(--font-mono);font-size:11.5px;line-height:1.6;font-variant-ligatures:none;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:4px 8px;overflow:hidden}
.job-out div{white-space:pre;overflow:hidden;text-overflow:ellipsis}
.job-out div:last-child{color:var(--fg)}
.job-out div.e{color:var(--err)}
.job-out.tall{max-height:240px;overflow:auto}
.job-out.tall div{overflow:visible;min-width:max-content}

/* ---------- wiring overlay (mockup only) ---------- */
.app.wiring [data-w]{outline:1px dashed color-mix(in srgb,var(--info) 65%,transparent);outline-offset:1px;cursor:help}
.app.wiring [data-w]:not(.badge):not(.sg){position:relative}
.app.wiring [data-w]::after{content:attr(data-w);position:absolute;top:1px;right:1px;z-index:6;font:600 9.5px/14px var(--font-mono);padding:0 4px;border-radius:4px;background:var(--wb,var(--info));color:#fff;pointer-events:none;letter-spacing:0;text-transform:none;font-style:normal}
.app.wiring [data-ws="SV"]{--wb:#3f8a2e}
.app.wiring [data-ws="INF"]{--wb:#b4561f}
.app.wiring [data-ws="UNV"]{--wb:#9a6408}
.app.wiring [data-ws="CLIENT"],.app.wiring [data-ws="SAMPLE"]{--wb:#6c6259}
.wbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--fg);padding:6px 14px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.app.wiring .wbar{display:flex}
.wbar i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.wpop{position:fixed;right:60px;bottom:16px;z-index:70;width:min(480px,calc(100vw - 32px));max-height:72vh;overflow:auto;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.wp-h{display:flex;align-items:center;gap:8px}
.wp-h b{color:var(--fg-strong);font-size:14px}
.wid{font:700 12px var(--font-mono);color:#fff;background:var(--info);border-radius:5px;padding:1px 6px}
.wst{font:600 11px var(--font-mono);border-radius:5px;padding:1px 6px;border:1px solid var(--border-strong);color:var(--fg)}
.wp-k{font-size:12px;color:var(--muted)}
.wp-sec{display:flex;flex-direction:column;gap:2px}
.wp-sec>span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.wp-sec div{color:var(--fg);line-height:1.55;overflow-wrap:anywhere}
.wp-sec code{font-size:12px;color:var(--code);background:var(--bg);padding:0 4px;border-radius:4px}
.wp-ev{display:flex;gap:4px;flex-wrap:wrap}
.wp-ev code{font-size:11.5px}
.wp-refs{display:flex;flex-direction:column;gap:2px;font-size:12px}
.wp-refs a{color:var(--link);font-family:var(--font-mono);font-size:11.5px;overflow-wrap:anywhere}
.wlink{font:600 12px var(--font-mono);color:var(--info);text-decoration:underline;text-underline-offset:2px}

const WIRING = {"S1":{"id":"S1","surface":"Sidebar","element":"Run list (recent / per repository)","kind":"Harness","status":"INF","shows":"One row per orchestration run, newest first, grouped under Recent and under the repository.","source":"Harness run index `GET /api/runs` → `{run_id, title, repo_root, updated_seq, live_agents}`. `title` = title of the approved plan, else the first user message cut to 60 chars.","updates":["plan_decided","user_message","agent_status"],"action":"Click opens the run (client navigation). Only the first run in the mockup has data; the others are sample rows (X1).","refs":[]},"S2":{"id":"S2","surface":"Sidebar","element":"Live-agent count on the run row (\"3 live\")","kind":"Harness","status":"INF","shows":"Number of agents that are not finished.","source":"Count of `AgentRecord` whose `status` is not `completed | failed | cancelled | crashed`.","updates":["agent_spawned","agent_status"],"action":"","refs":[]},"S3":{"id":"S3","surface":"Sidebar","element":"Agent tree under the run","kind":"Harness","status":"INF","shows":"Every agent of the run with a status glyph and its first task id (or 'lead').","source":"`AgentRecord{id, parent, depth, tasks, status}` ordered by depth then spawn seq. Glyph = display status D1. Right label = lowest `TaskId` in `tasks`, or 'lead' for the orchestrator.","updates":["agent_spawned","agent_status","task_changed"],"action":"Click focuses that agent's transcript (client).","refs":[]},"S4":{"id":"S4","surface":"Sidebar","element":"Repository group header","kind":"Git","status":"INF","shows":"Repository name.","source":"Basename of `git rev-parse --show-toplevel` for the run's `repo_root`.","updates":[],"action":"","refs":[]},"S5":{"id":"S5","surface":"Sidebar","element":"Agent worktrees list","kind":"Harness","status":"INF","shows":"Branch of each writing agent's worktree, coloured by agent.","source":"`AgentRecord.workspace = Worktree{path, branch, base_commit}`; reconciled against `git worktree list --porcelain` at harness start.","updates":["agent_spawned","agent_status"],"action":"Click opens the Worktrees tab (G1, G2).","refs":[]},"S6":{"id":"S6","surface":"Sidebar","element":"Copilot CLI status footer","kind":"SDK + Harness","status":"SV+INF","shows":"Whether the single Copilot CLI child process is up and how many agent sessions it hosts.","source":"Process up = `Client::pid()` returns `Some` (SV); exits are observed on `Client::subscribe_lifecycle()` (SV); liveness is `Client::ping` every 30 s (SV). Session count = agents whose `CopilotBinding` is live (harness). RSS is read by the harness supervisor from the OS for that pid; session workspace sizes come from `rpc().sessions().get_sizes()` (SV). At 3 GiB RSS the footer shows the memory step in progress: closing idle sessions, then 'recycle pending' (section 4.4).","updates":["health","agent_resumed"],"action":"","refs":[{"label":"Client::pid","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/lib.rs#L3053"},{"label":"Client::subscribe_lifecycle","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/lib.rs#L3328"},{"label":"sessions.getSizes","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/rpc.rs#L5825"},{"label":"Client::ping","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/lib.rs#L2831"}]},"S7":{"id":"S7","surface":"Sidebar","element":"New session, history, search buttons","kind":"Client","status":"INF","shows":"Placeholders in the mockup.","source":"New session = harness command `create_run`. History and search are client views over S1.","updates":[],"action":"","refs":[]},"H1":{"id":"H1","surface":"Header","element":"Title and breadcrumb","kind":"Harness","status":"INF","shows":"Run title; when an agent is focused, the parent chain ending in that agent.","source":"Run title (S1). Breadcrumb = `AgentRecord.parent` chain of the focused agent.","updates":["plan_decided","agent_spawned"],"action":"Clicking a crumb focuses that agent (client).","refs":[]},"H2":{"id":"H2","surface":"Header","element":"Subtitle in the lead view","kind":"Git + SDK","status":"SV+INF","shows":"Repository, checked-out branch of the main checkout, short id of the lead's Copilot session.","source":"Branch = `git rev-parse --abbrev-ref HEAD` in `repo_root`. Session id = `Session::id()` of the orchestrator's current generation (first 8 chars).","updates":["agent_rotated"],"action":"","refs":[{"label":"Session::id","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/session.rs#L628"}]},"H3":{"id":"H3","surface":"Header","element":"Subtitle in an agent view","kind":"Harness","status":"INF","shows":"Agent kind, its task id and title, its worktree branch.","source":"`AgentRecord.kind`, board `Task{id, title}` for its first task, `Workspace` branch or 'main (read-only)'.","updates":["agent_status","task_changed"],"action":"","refs":[]},"H4":{"id":"H4","surface":"Header","element":"'N active' chip","kind":"Harness","status":"INF","shows":"Agents currently doing or blocked on something.","source":"Count of agents whose display status D1 is `running | needs_permission | needs_answer | waiting_on_agents`.","updates":["agent_status","permission","mail_state"],"action":"Opens the Agents tab.","refs":[]},"H5":{"id":"H5","surface":"Header","element":"'N need you' chip","kind":"Harness","status":"INF","shows":"Items that wait on the user.","source":"D8.","updates":["mail_created","mail_state","plan_version_created","plan_decided","permission"],"action":"Focuses the lead transcript and scrolls to the first open card (C11, C12, C13).","refs":[]},"H6":{"id":"H6","surface":"Header","element":"Context ring of the focused agent","kind":"SDK","status":"SV","shows":"Context window used by the focused agent's current Copilot session.","source":"D5 = `current_tokens / token_limit` of the latest `session.usage_info`. Turns warning colour at or above the agent's compaction threshold D11.","updates":["usage","agent_rotated"],"action":"","refs":[{"label":"SessionUsageInfoData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L2431-L2449"},{"label":"InfiniteSessionConfig","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/types.rs#L1001-L1012"}]},"H7":{"id":"H7","surface":"Header","element":"BYOK chip","kind":"Config + SDK","status":"SV","shows":"Name of the provider profile the focused agent's session uses.","source":"Harness config profile → `SessionConfig.provider: ProviderConfig{provider_type, base_url, api_key, wire_api, …}` (SV). Each model call reports `assistant.usage.is_byok` (SV), which the harness can assert. Keys are never sent to the UI.","updates":["agent_spawned","agent_rotated"],"action":"","refs":[{"label":"ProviderConfig","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/types.rs#L1295-L1317"},{"label":"SessionConfig.provider","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/types.rs#L2286"},{"label":"AssistantUsageData.is_byok","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L4102"}]},"H8":{"id":"H8","surface":"Header","element":"Theme toggle","kind":"Client","status":"CLIENT","shows":"Light or dark theme.","source":"Client preference only.","updates":[],"action":"","refs":[]},"H9":{"id":"H9","surface":"Header","element":"'Wiring' toggle","kind":"Client","status":"CLIENT","shows":"Mockup-only overlay that labels every element with its wiring id.","source":"Exists only in this mockup; not part of the product.","updates":[],"action":"","refs":[]},"C1":{"id":"C1","surface":"Chat","element":"'N earlier events · load older'","kind":"Harness","status":"INF","shows":"How many older events of the focused agent are not loaded, and a control to page them in.","source":"`GET /api/runs/{run}/events?agent={id}&before_seq={first_loaded}&limit=200`, served from the harness log via its sparse index. Never served from Copilot `Session::get_events()`, which loads a whole timeline into memory.","updates":[],"action":"Loads one page and prepends it (client keeps at most E3 events).","refs":[{"label":"Session::get_events (not used)","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/session.rs#L1084"}]},"C2":{"id":"C2","surface":"Chat","element":"User message bubble","kind":"Harness + SDK","status":"SV+INF","shows":"Text the user sent to the focused agent, with time.","source":"Harness `user_message` event when the UI command is accepted. The Copilot echo `user.message{content, delivery, message_id}` (SV) confirms it entered the session.","updates":["user_message","copilot:user.message"],"action":"","refs":[{"label":"UserMessageData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L3143-L3184"}]},"C3":{"id":"C3","surface":"Chat","element":"Assistant message header","kind":"Harness + SDK","status":"SV","shows":"Agent name, role pill, model.","source":"Name and role from `AgentRecord`. Model from `assistant.message.model` or `assistant.usage.model` (SV).","updates":["copilot:assistant.message","copilot:assistant.usage"],"action":"","refs":[{"label":"AssistantMessageData.model","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L3820"},{"label":"AssistantUsageData.model","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L4110"}]},"C4":{"id":"C4","surface":"Chat","element":"'Thinking' row","kind":"SDK","status":"SV","shows":"First line of the model's reasoning for the turn, expandable.","source":"`assistant.reasoning{reasoning_id, content}`; streamed as `assistant.reasoning_delta{reasoning_id, delta_content}`. Present only if the BYOK provider and model emit reasoning (provider-dependent).","updates":["copilot:assistant.reasoning","delta_batch"],"action":"","refs":[{"label":"AssistantReasoningData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L3508-L3515"},{"label":"AssistantReasoningDeltaData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L3521-L3525"}]},"C5":{"id":"C5","surface":"Chat","element":"Activity group (tool rows)","kind":"SDK + Harness","status":"SV+INF","shows":"One row per tool call: icon, verb, argument summary, duration.","source":"Row opens on `tool.execution_start{tool_call_id, tool_name, tool_title, arguments, shell_tool_info.display_command}` and closes on `tool.execution_complete{tool_call_id, success, error, file_edits}`. Verb = harness table keyed by `tool_name`; built-in names are read at runtime from `rpc().tools().get_builtin_descriptors()` (method SV, names UNV, probe V8). Argument = `tool_title`, else `display_command`, else first path in `arguments`. Duration = difference of the two envelopes' `SessionEvent.timestamp`. '+N −M' on edit rows comes from D9.","updates":["tool_started","tool_finished"],"action":"","refs":[{"label":"ToolExecutionStartData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L4604-L4662"},{"label":"ToolExecutionCompleteData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L5202-L5281"},{"label":"SessionEvent.timestamp","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/types.rs#L6124-L6146"},{"label":"tools.get_builtin_descriptors","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/rpc.rs#L17586"}]},"C6":{"id":"C6","surface":"Chat","element":"Assistant text","kind":"SDK","status":"SV","shows":"The assistant's reply, rendered as markdown.","source":"Final text = `assistant.message{message_id, content}`. While streaming, `assistant.message_delta{message_id, delta_content}` is merged by the harness into ephemeral `delta_batch` frames (flush every 50 ms or 4 KiB).","updates":["copilot:assistant.message","delta_batch"],"action":"","refs":[{"label":"AssistantMessageData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L3775-L3867"},{"label":"AssistantMessageDeltaData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L3884-L3893"}]},"C7":{"id":"C7","surface":"Chat","element":"Turn footer (duration · tokens)","kind":"SDK + Harness","status":"SV+INF","shows":"Wall time of the turn, tokens it used, and the share of input served from the provider's prompt cache.","source":"Duration = `assistant.turn_end.timestamp − assistant.turn_start.timestamp` joined on `turn_id` (SV). Tokens = Σ `input_tokens + output_tokens` of the `assistant.usage` events received between them; cached share = Σ `cache_read_tokens` / Σ `input_tokens` (fields SV, join INF; whether `input_tokens` already includes cache reads is probe V17).","updates":["copilot:assistant.turn_end","copilot:assistant.usage"],"action":"","refs":[{"label":"AssistantUsageData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L4009-L4123"},{"label":"AssistantTurnStartData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L3195-L3206"},{"label":"AssistantTurnEndData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L3899-L3907"},{"label":"AssistantUsageData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L4009-L4211"}]},"C8":{"id":"C8","surface":"Chat","element":"Inline agent card (spawned subagent or teammate)","kind":"Harness + SDK","status":"SV+INF","shows":"Kind, name, task, status, current activity, step progress, branch, context %, elapsed time, tokens, model; buttons Open, Message, Stop.","source":"Anchored where the parent called `spawn_agent`: `ToolInvocation.tool_call_id` (SV) is stored as `AgentRecord.spawned_by_call`. Fields: status D1, activity D2, step D3, context D5, elapsed D6, tokens D7, task from the board, branch from `Workspace`.","updates":["agent_spawned","agent_status","task_changed","scratch_todos","usage","copilot:assistant.intent","agent_resumed"],"action":"Open → focus the agent (client). Message → sets composer target (K3). Stop (two-step) → harness `agent_stop` → `Session::abort()`, then `rpc().sessions().close(..)` once `session.idle` arrives; owned tasks return to `pending`; agent becomes `cancelled`.","refs":[{"label":"ToolInvocation","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/types.rs#L6189-L6195"},{"label":"Session::abort","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/session.rs#L1109"},{"label":"sessions.close","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/rpc.rs#L5918"}]},"C9":{"id":"C9","surface":"Chat","element":"Finished subagent result","kind":"Harness","status":"INF","shows":"Short result of a finished agent; 'Full report' expands it.","source":"`TaskResult.summary` (≤ 2 KiB) parsed from the child's final `assistant.message` using the fixed headings SUMMARY / EVIDENCE / CHANGES / RISKS / BLOCKERS; the full text is a blob.","updates":["agent_status","task_changed"],"action":"'Full report' fetches `GET /api/blobs/{sha}`.","refs":[]},"C10":{"id":"C10","surface":"Chat","element":"Approved plan card","kind":"Harness","status":"INF","shows":"Plan version, task rows (id, title, owner, dependencies), who approved and when.","source":"`PlanVersion{version, markdown, ops, state: approved, decided}` created when the orchestrator called `submit_plan`; rows from its `TaskSpec`s after ids were assigned.","updates":["plan_version_created","plan_decided"],"action":"Header toggles the row list (client).","refs":[]},"C11":{"id":"C11","surface":"Chat","element":"Re-plan card awaiting approval","kind":"Harness + SDK","status":"SV+INF","shows":"Proposed version, reason, '+' rows for added tasks, rows whose dependencies change; Approve / Edit plan / Reject.","source":"`PlanVersion` N+1 from the orchestrator's `propose_plan_change` (state `awaiting_approval`). '+' rows = `Add` ops; changed dependencies = `Rewire` ops.","updates":["plan_version_created","plan_decided"],"action":"Approve → `plan_decide{version, approve}` → board applies ops (`task_created`, `task_changed`) and a `Notify{PlanApproved}` mail reaches the orchestrator via `Session::send(MessageOptions{mode: Enqueue})`. Edit → Plan tab (P1). Reject → `plan_decided{rejected{feedback}}` plus `Notify{PlanRejected}`.","refs":[{"label":"DeliveryMode","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/types.rs#L5858-L5862"},{"label":"Session::send","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/session.rs#L842"}]},"C12":{"id":"C12","surface":"Chat","element":"Ask card ('Needs your answer')","kind":"Harness + SDK","status":"SV+INF","shows":"A child's question that reached the user, with choices and a free-text reply.","source":"An `Ask` mail. It originates from the harness `ask` tool, or from Copilot's built-in ask-user, which calls the harness `UserInputHandler` with `user_input.requested{question, choices, allow_freeform}` (SV). It reaches the user when the parent calls `ask{forward: <mail id>}`, or when the parent is idle or `InputRequired` and has not answered within 120 s of its next wake.","updates":["mail_created","mail_state","agent_status"],"action":"Choice or reply → `answer_ask{mail_id, text}` → `Answer` mail delivered to the asker with `Session::send(… mode: Enqueue)`. If the ask came through `UserInputHandler` and is answered within 60 s, the pending handler returns `UserInputResponse{answer, was_freeform}` (SV) instead; after 60 s the handler has already returned \"no answer yet\" and the answer goes by `Enqueue`.","refs":[{"label":"UserInputRequestedData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L7638-L7651"},{"label":"UserInputResponse","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/handler.rs#L149"},{"label":"UserInputHandler","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/handler.rs#L303"}]},"C13":{"id":"C13","surface":"Chat","element":"Permission card","kind":"SDK + Harness","status":"SV+UNV","shows":"Which agent wants to run what, why, in which worktree; Deny / Always allow in this worktree / Allow once; a countdown to auto-deny.","source":"Created when the SDK calls `PermissionHandler::handle(session_id, request_id, PermissionRequestData{kind, tool_call_id, extra})` (SV). Command text, intention and paths are parsed from `extra` into the generated `PermissionRequestShell{full_command_text, intention, possible_paths, can_offer_session_approval}` (field names SV; the SDK documents that `extra` varies by CLI version, so parsing is probe V6). Worktree = the agent's `Workspace`.","updates":["permission"],"action":"Allow once → `PermissionResult::approve_once()` (SV). Always allow in worktree → `PermissionDecision::ApproveForLocation{location_key, …}` (variant SV, `location_key` meaning UNV, probe V11) or, as fallback, a harness rule plus `approve_once`. Deny → `PermissionResult::reject(feedback)` (SV). Decision 10: with no click after 90 s the handler returns `reject(\"waiting for user approval; you will be told when to retry\")`; the card switches to 'Approve & retry', which stores the rule and sends the agent a `Directive` via `Enqueue`.","refs":[{"label":"PermissionHandler","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/handler.rs#L204-L211"},{"label":"PermissionResult","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/handler.rs#L54-L131"},{"label":"PermissionRequestData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/types.rs#L6644"},{"label":"PermissionRequestShell","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L6057-L6082"},{"label":"PermissionDecision variants","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/api_types.rs#L48502-L48508"},{"label":"PermissionCompletedData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L7311-L7334"}]},"C14":{"id":"C14","surface":"Chat","element":"Inline mail row","kind":"Harness","status":"INF","shows":"A message between two agents: sender, recipient, kind, time, delivery state.","source":"`MailMessage{from, to, kind, summary, state}`. Shown in the sender's and recipient's transcripts, and in the lead transcript when both parties are in its subtree.","updates":["mail_created","mail_state"],"action":"","refs":[]},"C15":{"id":"C15","surface":"Chat","element":"Steer bubble with delivery line","kind":"Harness + SDK","status":"SV+UNV","shows":"A user message to a non-lead agent and how it was delivered.","source":"`Steer` mail. Delivery line = D10 over `DeliveryState`: `held` → `submitted` (when `Session::send` returns its message id, SV) → `in_context{delivery}` when `user.message.delivery` is `idle | steering | queued` (SV). Matching the send's id to `user.message.message_id` is probe V3.","updates":["mail_created","mail_state","copilot:user.message"],"action":"","refs":[{"label":"UserMessageDelivery","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L10053-L10066"},{"label":"UserMessageData.message_id","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L3163"}]},"C16":{"id":"C16","surface":"Chat","element":"Compaction divider","kind":"SDK + Harness","status":"SV+INF","shows":"Context compaction: utilisation when it started, tokens before and after, messages removed, and what the summarizer call cost (tokens in, cached, out, duration). A failed compaction shows its error and the failure count toward RT1.","source":"`session.compaction_start{trigger, current_tokens, token_limit}` and `session.compaction_complete{success, error, pre_compaction_tokens, post_compaction_tokens, messages_removed, summary_content, compaction_tokens_used{input_tokens, output_tokens, cache_read_tokens, duration}}` (SV), normalized to the `Compaction` EventKind. 'k of 2 failed' = `CopilotBinding.failed_compactions_in_a_row` against RT1 (harness). 'View summary' opens the `summary_content` blob.","updates":["compaction","usage"],"action":"'View summary' fetches the `summary_content` blob.","refs":[{"label":"SessionCompactionStartData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L2466-L2487"},{"label":"SessionCompactionCompleteData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L2579-L2652"},{"label":"CompactionCompleteCompactionTokensUsed","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L2527-L2562"},{"label":"CompactionTrigger","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L9667-L9686"}]},"C17":{"id":"C17","surface":"Chat","element":"Session rotation divider","kind":"Harness","status":"INF","shows":"The agent moved to a new Copilot session (generation) after a rescue trigger, which trigger, and the handoff size in tokens.","source":"`agent_rotated{from_generation, to_session, trigger: RT1 | RT2 | RT3 | RT4, handoff, handoff_tokens}` (section 4.3). Handoff ≤ 8 KiB = last `compaction_complete.summary_content` (SV field, reused at no extra cost) + owned tasks, mail summaries, private checklist, last assistant message, `git diff --stat`, edited paths. The old session is closed with `rpc().sessions().close` (SV).","updates":["agent_rotated"],"action":"'View handoff' fetches the blob.","refs":[{"label":"summary_content","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L2637"},{"label":"sessions.close","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/rpc.rs#L5918"}]},"C18":{"id":"C18","surface":"Chat","element":"Task brief (top of an agent view)","kind":"Harness + SDK","status":"SV+INF","shows":"The instructions the parent gave when spawning, plus what context, tools and workspace the agent got.","source":"The spawn `Directive` mail (= `spawn_agent.prompt`). Tools line = the agent's `SessionConfig.available_tools` / `excluded_tools` (SV). Workspace = `SessionConfig.working_directory` (SV).","updates":["agent_spawned","mail_created"],"action":"","refs":[{"label":"SessionConfig.available_tools / excluded_tools","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/types.rs#L2122-L2124"},{"label":"SessionConfig.working_directory","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/types.rs#L2331"}]},"C19":{"id":"C19","surface":"Chat","element":"Private checklist","kind":"Harness","status":"INF","shows":"The agent's own step list; not on the task board.","source":"Harness tool `todo_write` (whole-list replace; one writer) → `AgentRecord.scratch`.","updates":["scratch_todos"],"action":"","refs":[]},"C20":{"id":"C20","surface":"Chat","element":"Diff card","kind":"SDK + Harness","status":"SV+INF","shows":"Lines changed by one edit, with file name and +/− counts.","source":"Triggered by `tool.execution_complete.file_edits[{kind, path}]` (SV). The event carries no line counts, so D9 computes the diff.","updates":["tool_finished"],"action":"","refs":[{"label":"ToolExecutionCompleteFileEdit","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L4736-L4740"},{"label":"ToolExecutionCompleteData.file_edits","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L5215"}]},"C21":{"id":"C21","surface":"Chat","element":"'Asked orchestrator' card (agent view)","kind":"Harness","status":"INF","shows":"The agent's own outstanding question and whether it was forwarded or answered.","source":"The agent's `Ask` mail and its `DeliveryState` / linked `Answer`.","updates":["mail_created","mail_state"],"action":"","refs":[]},"C22":{"id":"C22","surface":"Chat","element":"Streaming text and caret","kind":"SDK","status":"SV","shows":"Text arriving live.","source":"Ephemeral `delta_batch` built from `assistant.message_delta.delta_content` (SV). The caret disappears when `assistant.message` with the same `message_id` arrives. Deltas never enter the durable log.","updates":["delta_batch","copilot:assistant.message"],"action":"","refs":[{"label":"AssistantMessageDeltaData","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L3884-L3893"}]},"C23":{"id":"C23","surface":"Chat","element":"'Result returned to parent' divider","kind":"Harness","status":"INF","shows":"The agent finished and its result went to the parent.","source":"`agent_status{completed}` and the `Notify{AgentCompleted}` mail to the parent.","updates":["agent_status","mail_created"],"action":"","refs":[]},"C24":{"id":"C24","surface":"Chat","element":"Idle note","kind":"Harness","status":"INF","shows":"Why an agent is idle.","source":"D1 = idle plus the board: owned tasks that are not ready and the tasks they wait on.","updates":["agent_status","task_changed"],"action":"","refs":[]},"C25":{"id":"C25","surface":"Chat","element":"Status line under the transcript","kind":"Harness","status":"INF","shows":"What the focused agent is doing right now.","source":"D1 for the focused agent. In the lead view: children that are running or waiting on the user, plus D8.","updates":["agent_status","permission","mail_state"],"action":"","refs":[]},"K1":{"id":"K1","surface":"Composer","element":"Changes strip (worktrees · files · +/−)","kind":"Git","status":"INF","shows":"Total uncommitted and committed change across writer worktrees since their base commit.","source":"For each writer worktree: `git -C <wt> diff --numstat <base_commit>` plus `git status --porcelain` (untracked files count as added). Recomputed, debounced 1 s, after any `tool.execution_complete` that has non-empty `file_edits` (SV) or comes from a shell tool (shell writes are not listed in `file_edits`, probe V15).","updates":["tool_finished"],"action":"Click opens the Worktrees tab.","refs":[{"label":"ToolExecutionCompleteData.file_edits","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L5215"}]},"K2":{"id":"K2","surface":"Composer","element":"Queued messages strip","kind":"Harness + SDK","status":"SV+UNV","shows":"Messages the user sent that are queued in an agent's Copilot session; Send now / Retract.","source":"Mail in state `submitted` not yet seen as `user.message`. On every `pending_messages.modified` the harness calls `rpc().queue().pending_items()` and emits `mail_state` envelopes; queue items carry the send's `message_id` (both SV; the queue namespace is experimental).","updates":["mail_state"],"action":"Send now → `rpc().queue().send_now({id})` with the queue item id from `pending_items()` (SV). Retract → `rpc().queue().withdraw_message{message_id, expected_prompt}` (SV), using the send id and the prompt stored in `DeliveryState::Submitted`.","refs":[{"label":"queue.pending_items","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/rpc.rs#L15511"},{"label":"queue.send_now","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/rpc.rs#L15825"},{"label":"queue.withdraw_message","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/rpc.rs#L15697"},{"label":"queue.remove_at","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/rpc.rs#L15631"},{"label":"QueueWithdrawMessageRequest","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/api_types.rs#L22160-L22164"}]},"K3":{"id":"K3","surface":"Composer","element":"'To' target picker","kind":"Client","status":"CLIENT","shows":"Which agent the message goes to, with each agent's status.","source":"Client list over `AgentRecord`s with D1. Typing `@agent-id ` at the start of the message also sets the target.","updates":["agent_status"],"action":"","refs":[]},"K4":{"id":"K4","surface":"Composer","element":"Target hint text","kind":"Client","status":"CLIENT","shows":"How the message will land given the target's state.","source":"From D1 of the target and the K5 toggle: idle → 'starts a new turn'; running + steer → 'steers the current turn'; running + queue → 'queued for the next turn'.","updates":["agent_status"],"action":"","refs":[]},"K5":{"id":"K5","surface":"Composer","element":"'Steer now' toggle","kind":"SDK","status":"SV","shows":"Whether a message to a running agent interrupts its current turn.","source":"On → `MessageOptions.mode = Some(DeliveryMode::Immediate)`; the echo arrives as `user.message.delivery = steering`. Off → `Enqueue`, echo `queued`. Default on for user → running agent. To an idle agent the mode does not matter; the echo is `idle`.","updates":[],"action":"","refs":[{"label":"DeliveryMode","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/types.rs#L5858-L5862"},{"label":"MessageOptions.mode","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/types.rs#L5927"}]},"K6":{"id":"K6","surface":"Composer","element":"Message input","kind":"SDK","status":"SV","shows":"Text to send.","source":"Becomes `MessageOptions.prompt`. Mail from agents is wrapped in a `<mail …>` envelope and `display_prompt` carries the human-readable text.","updates":[],"action":"Enter sends (K11).","refs":[{"label":"MessageOptions","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/types.rs#L5913-L5953"}]},"K7":{"id":"K7","surface":"Composer","element":"Attach button","kind":"SDK","status":"SV","shows":"Attach files or images.","source":"`MessageOptions.attachments`.","updates":[],"action":"","refs":[{"label":"MessageOptions.attachments","href":"https://git  count","kind":"Harness","status":"INF","shows":"How many background shells are running: header chip, composer strip, rail badge, and a per-agent count on the sidebar, agent rows and task cards.","source":"Jobs in the harness projection whose D12 status is Running or Idle, grouped by owner. Finished jobs are not counted.","updates":["bg_job_started","bg_job_exited","agent_status"],"action":"Click opens the Background tab.","refs":[]},"B4":{"id":"B4","surface":"Background tab","element":"Stop and Clear","kind":"SDK + Harness","status":"SV+INF","shows":"Stop on a running job (two clicks) and Clear on the Finished group.","source":"Stop sends `job_stop{job_id}` → `tasks().cancel({id})` (SV) on the owner's session. The job ends as Stopped and the owner gets a `Notify` mail. If `cancelled` is false and the job is detached with a `pid`, the harness kills the process group (INF). Clear sends `job_clear` → `tasks().remove({id})` (SV) per finished job; the harness keeps its records and output blobs. `agent_stop` cancels the agent's running jobs before `abort()` (INF).","updates":["bg_job_exited"],"action":"Stop: the first click arms, the second cancels. Clear: hides finished jobs from the tab.","refs":[{"label":"tasks.cancel","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/rpc.rs#L17387"},{"label":"tasks.remove","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/rpc.rs#L17417"}]},"B5":{"id":"B5","surface":"Chat","element":"'Started in background' card","kind":"SDK + Harness","status":"SV+UNV","shows":"In the owner's transcript: the shell call that started a background job, its live status, elapsed time and last output lines.","source":"The `tool.execution_start` row (C5) whose `shell_tool_info.display_command` matches a new `TaskShellInfo.command` with `execution_mode: background` (SV fields). The harness links the call and the job through `bg_job_started.tool_call_id` (INF). That `TaskShellInfo.id` can be matched to the tool call is probe V19; the fallback is command text plus start time. A sync shell moved to the background with `tasks().promote_to_background({id})` (SV) gets the same card.","updates":["tool_started","bg_job_started","bg_job_exited"],"action":"Show in Background opens the tab at this job. Stop as in B4.","refs":[{"label":"tasks.promoteToBackground","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/rpc.rs#L17321"},{"label":"TaskShellInfo.execution_mode","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/api_types.rs#L29393-L29395"}]},"B6":{"id":"B6","surface":"Chat","element":"Background job exit divider","kind":"Harness + SDK","status":"INF+UNV","shows":"A divider in the owner's transcript when a job leaves Running: exit code, duration, and how the owner was told.","source":"`bg_job_exited{job, status, exit_code, duration_ms, tail}`. The exit code comes from `ToolExecutionCompleteContentShellExit{shell_id, exit_code, output_preview}` (SV type) when one arrives, else it shows as unknown; which event carries it for a background shell is probe V19. The harness then sends the owner a `Notify` mail with the exit code and the last 20 lines (`Enqueue` when mid-turn, a new turn when idle), so agents never poll their jobs (INF). copilot-cli #4946 reports an HTTP 400 after a background shell completion; V19 checks it on each BYOK route.","updates":["bg_job_exited","mail_created","mail_state"],"action":"","refs":[{"label":"ToolExecutionCompleteContentShellExit","href":"https://github.com/github/copilot-sdk/blob/b19d3ef043ebfeaeb794339173c39ad6c8eb29ca/rust/src/generated/session_events.rs#L4872-L4891"}]},"R1":{"id":"R1","surface":"Rail","element":"Panel buttons","kind":"Client","status":"CLIENT","shows":"Which side panel is open.","source":"Client state.","updates":[],"action":"","refs":[] function depth(t,memo={}){ if(memo[t.id]!=null) return memo[t.id]; return memo[t.id]=t.deps.length?1+Math.max(...t.deps.map(d=>depth(tk(d),memo))):0; }
function pGraph(){
  const vis=TASKS.filter(t=>t.st!=='cancelled'), memo={}, rows={};
  vis.forEach(t=>{const d=depth(t,memo);(rows[d]=rows[d]||[]).push(t);});
  const W=320, NW=142, NH=44, RG=30, pos={};
  Object.keys(rows).forEach(d=>{ const r=rows[d], gap=(W-r.length*NW)/(r.length+1); r.forEach((t,i)=>pos[t.id]={x:gap+i*(NW+gap),y:8+d*(NH+RG)}); });
  const H=8+(Math.max(...Object.keys(rows).map(Number))+1)*(NH+RG)-RG+8;
  let edges='';
  vis.forEach(t=>t.deps.forEach(d=>{ if(!pos[d]) return; const a=pos[d], b=pos[t.id];
    const x1=a.x+NW/2, y1=a.y+NH, x2=b.x+NW/2, y2=b.y, my=(y1+y2)/2;
    edges+=`<path class="g-edge ${t.st==='proposed'?'prop':''}" d="M${x1} ${y1} C${x1} ${my} ${x2} ${my} ${x2} ${y2}"/>`; }));
  const nodes=vis.map(t=>{ const p=pos[t.id], s=tdisp(t);
    return `<g class="g-node ${s==='in_progress'?'in_progress':s==='done'?'done':s==='proposed'?'proposed':''}" transform="translate(${p.x} ${p.y})" data-act="task" data-task="${t.id}" tabindex="0" role="button" aria-label="${t.id} ${esc(t.title)}, ${TST[s].l}">
      <rect width="${NW}" height="${NH}" rx="7"/><text class="gid" x="9" y="17">${t.id}</text><text class="go" x="${NW-9}" y="17" text-anchor="end">${TST[s].l}</text>
      <text class="gt" x="9" y="34">${esc(t.title.length>21?t.title.slice(0,20)+'…':t.title)}</text></g>`; }).join('');
  return `<div class="graph" ${wa('T2')}><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Task dependency graph">${edges}${nodes}</svg></div>
    <div class="legend" ${wa('D4')}>${['done','in_progress','ready','waiting','proposed'].map(k=>`<span>${glyph(TST[k].g)}${TST[k].l}</span>`).join('')}</div>`;

function endJob(j, st, code, byAgentStop){
  j.st=st; j.code=code; j.ended=simClock(); j.dur=fdur(j.t);
  const what = st==='cancelled' ? 'cancelled (session.tasks.cancel)' : `exit ${code}`;
  const seq=logEvent('harness','bg_job_exited',`${j.id} · ${j.agent} · ${what} · ${j.dur}`);
  if(byAgentStop){ T[j.agent].push({t:'bgexit',id:j.id,note:`cancelled because ${j.agent} was stopped`}); return; }
  const A=AG[j.agent], idle=A.status==='idle';
  const text = st==='cancelled' ? `Background job ${j.id} was stopped by the user after ${j.dur}: ${j.cmd}`
    : `Background job ${j.id} ${st==='failed'?'failed with exit '+code:'exited '+code} after ${j.dur}: ${j.cmd} · ${j.out[j.out.length-1].trim()}`;
  MAIL.push({id:'n'+j.id,from:'harness',to:j.agent,kind:'notify',time:simClock(),seq,state:idle?'in_context':'submitted',delivery:idle?'idle':undefined,text});
  T[j.agent].push({t:'bgexit',id:j.id,mail:'n'+j.id});
}

document.addEventListener('click',e=>{

  const act=el.dataset.act, a=el.dataset.agent;
  if(act!=='stop' && state.stopArm){ state.stopArm=null; }

    case 'open': openAgent(a); break;
    case 'msg': state.target=a; state.menu=false; renderComposer(); $('#input').focus(); break;
