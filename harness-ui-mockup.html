ons it hosts.","source":"Process up = `Client::pid()` returns `Some` (SV); exits are observed on `Client::subscribe_lifecycle()` (SV); liveness is `Client::ping` every 30 s (SV). Session count = agents whose `CopilotBinding` is live (harness). RSS is read by the harness supervisor from the OS for that pid; session workspace sizes come from `rpc().sessions().get_sizes()` (SV). At 3 GiB RSS the item shows the memory step in progress: closing idle sessions, then 'recycle pending' (section 4.4).","updates":["health","agent_resumed"],"action":"","refs":[{"label":"Client::pid","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/lib.rs#L3058"},{"label":"Client::subscribe_lifecycle","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/lib.rs#L3333"},{"label":"sessions.getSizes","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L5874"},{"label":"Client::ping","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/lib.rs#L2836"}]},"S7":{"id":"S7","surface":"Sidebar","element":"New session and search","kind":"Client","status":"INF","shows":"Placeholders in the mockup.","source":"New session = harness command `create_run`. Search is a client view over S1.","updates":[],"action":"","refs":[]},"H1":{"id":"H1","surface":"Chat header","element":"Title tab and breadcrumb","kind":"Harness","status":"INF","shows":"Run title; when an agent is focused, the parent chain ending in that agent.","source":"Run title (S1). Breadcrumb = `AgentRecord.parent` chain of the focused agent.","updates":["plan_decided","agent_spawned"],"action":"Clicking a crumb focuses that agent (client).","refs":[]},"H2":{"id":"H2","surface":"Status bar","element":"Repository, branch and lead session","kind":"Git + SDK","status":"SV+INF","shows":"Repository, base branch of the run with ahead / behind counts, and the short id of the lead's Copilot session.","source":"Branch = `git rev-parse --abbrev-ref HEAD` in `repo_root`. Session id = `Session::id()` of the orchestrator's current generation (first 8 chars). Ahead / behind = `git rev-list --left-right --count origin/<branch>...HEAD`.","updates":["agent_rotated"],"action":"","refs":[{"label":"Session::id","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/session.rs#L628"}]},"H3":{"id":"H3","surface":"Chat header","element":"Agent subtitle","kind":"Harness","status":"INF","shows":"Agent kind and its task id and title. The status bar shows its worktree branch in the same view.","source":"`AgentRecord.kind`, board `Task{id, title}` for its first task, `Workspace` branch or 'main (read-only)'.","updates":["agent_status","task_changed"],"action":"","refs":[]},"H5":{"id":"H5","surface":"Chat header","element":"'N need you' chip","kind":"Harness","status":"INF","shows":"Items that wait on the user.","source":"D8.","updates":["mail_created","mail_state","plan_version_created","plan_decided","permission"],"action":"Focuses the lead transcript and scrolls to the first open card (C11, C12, C13).","refs":[]},"H6":{"id":"H6","surface":"Composer","element":"Context gauge in the stats line","kind":"SDK","status":"SV","shows":"Context window used by the focused agent's current Copilot session, as a 270° gauge with a tick at its compaction threshold D11. The arc and percentage shift from grey to amber over the 15 points below the tick and stay amber above it.","source":"D5 = `current_tokens / token_limit` of the latest `session.usage_info`. Tick position and colour ramp come from D11 (0.80 for the 200K windows in the sample).","updates":["usage","agent_rotated"],"action":"Click opens the breakdown H11.","refs":[{"label":"SessionUsageInfoData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L2431-L2449"},{"label":"InfiniteSessionConfig","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L1001-L1012"}]},"H7":{"id":"H7","surface":"Composer","element":"BYOK provider","kind":"Config + SDK","status":"SV","shows":"Name of the provider profile the target agent's session uses.","source":"Harness config profile → `SessionConfig.provider: ProviderConfig{provider_type, base_url, api_key, wire_api, …}` (SV). Each model call reports `assistant.usage.is_byok` (SV), which the harness can assert. Keys are never sent to the UI.","updates":["agent_spawned","agent_rotated"],"action":"","refs":[{"label":"ProviderConfig","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L1295-L1317"},{"label":"SessionConfig.provider","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L2291"},{"label":"AssistantUsageData.is_byok","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L4098"}]},"H8":{"id":"H8","surface":"Title bar","element":"Theme toggle","kind":"Client","status":"CLIENT","shows":"Light or dark theme.","source":"Client preference only.","updates":[],"action":"","refs":[]},"H9":{"id":"H9","surface":"Title bar","element":"'Wiring' toggle","kind":"Client","status":"CLIENT","shows":"Mockup-only overlay that labels every element with its wiring id.","source":"Exists only in this mockup; not part of the product.","updates":[],"action":"","refs":[]},"H10":{"id":"H10","surface":"Title bar","element":"'Drop link' toggle (mockup only)","kind":"Client","status":"CLIENT","shows":"Simulates losing the harness stream so the connection banner C26 can be seen.","source":"Exists only in this mockup; not part of the harness API. The outage lasts about 12 s, so the third automatic retry succeeds.","updates":[],"action":"Click drops the simulated link; click again ('Restore link') reconnects at once.","refs":[]},"H11":{"id":"H11","surface":"Composer","element":"Context breakdown popover","kind":"SDK + Harness","status":"SV+INF","shows":"For the focused agent: tokens in context out of the window, split into system, tools, history and files on one bar with ticks at D11 and 95%, and how far the session is from compaction. The numbers in the mockup are sample data (X1).","source":"The latest `session.usage_info{current_tokens, token_limit, system_tokens, tool_definitions_tokens, conversation_tokens}` of the agent's current generation (SV). System = `system_tokens`. Tools = `tool_definitions_tokens`. Files = the harness's estimate of file content still in context: read-tool results and attachments since the last compaction, at about 4 bytes per token, capped at `conversation_tokens` (INF). History = `conversation_tokens` − Files, plus any gap between the four parts and `current_tokens`. Compaction point = D11 × `token_limit`.","updates":["usage","agent_rotated"],"action":"'All agents' opens the Agents tab, where each agent row (A2) has the same meter. Escape or a click outside closes it and returns focus to H6.","refs":[{"label":"SessionUsageInfoData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L2431-L2449"},{"label":"InfiniteSessionConfig","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L1001-L1012"}]},"H12":{"id":"H12","surface":"Title bar","element":"Chat / Code switch","kind":"Client","status":"CLIENT","shows":"Switches between the conversation layout and the Code view (W1–W6). The run, the focused agent and the composer stay the same.","source":"Client state.","updates":[],"action":"Code puts the editor in the middle and the chat on the right; the side panel is hidden until you switch back.","refs":[]},"H13":{"id":"H13","surface":"Title bar","element":"Sidebar toggle and phone panel button","kind":"Client","status":"CLIENT","shows":"Whether the sidebar is visible and, on phones, whether the side panel is open. On wider screens the right rail (R1) opens and closes the panel.","source":"Client state.","updates":[],"action":"Click toggles. In the Code view the panel button switches back to Chat.","refs":[]},"H14":{"id":"H14","surface":"Title bar","element":"Details switch","kind":"Client","status":"CLIENT","shows":"Off (the default): a simple view with the conversation, the cards that need the user, agent status and the composer. On: the full view, which adds tool steps, reasoning, agent-to-agent mail, dividers, checklists, diffs, job cards, turn stats with the context gauge, the status bar and five more views on the right rail. Section 10.8 lists what each mode shows.","source":"Client preference kept per browser (`localStorage`). The harness streams the same events in both modes; only the rendering changes.","updates":[],"action":"Click toggles the mode. The focused agent and the scroll position stay; if the open panel view exists only in Details, the panel switches to Agents.","refs":[]},"C1":{"id":"C1","surface":"Chat","element":"'N earlier events · load older'","kind":"Harness","status":"INF","shows":"How many older events of the focused agent are not loaded, and a control to page them in.","source":"`GET /api/runs/{run}/events?agent={id}&before_seq={first_loaded}&limit=200`, served from the harness log via its sparse index. Never served from Copilot `Session::get_events()`, which loads a whole timeline into memory.","updates":[],"action":"Loads one page and prepends it (client keeps at most E3 events).","refs":[{"label":"Session::get_events (not used)","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/session.rs#L1084"}]},"C2":{"id":"C2","surface":"Chat","element":"User message bubble","kind":"Harness + SDK","status":"SV+INF","shows":"Text the user sent to the focused agent, with time.","source":"Harness `user_message` event when the UI command is accepted. The Copilot echo `user.message{content, delivery, message_id}` (SV) confirms it entered the session.","updates":["user_message","copilot:user.message"],"action":"","refs":[{"label":"UserMessageData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L3139-L3180"}]},"C3":{"id":"C3","surface":"Chat","element":"Assistant message header","kind":"Harness + SDK","status":"SV","shows":"Agent name, role pill, model.","source":"Name and role from `AgentRecord`. Model from `assistant.message.model` or `assistant.usage.model` (SV).","updates":["copilot:assistant.message","copilot:assistant.usage"],"action":"","refs":[{"label":"AssistantMessageData.model","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L3816"},{"label":"AssistantUsageData.model","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L4106"}]},"C4":{"id":"C4","surface":"Chat","element":"'Thinking' row","kind":"SDK","status":"SV","shows":"First line of the model's reasoning for the turn, expandable.","source":"`assistant.reasoning{reasoning_id, content}`; streamed as `assistant.reasoning_delta{reasoning_id, delta_content}`. Present only if the BYOK provider and model emit reasoning (provider-dependent).","updates":["copilot:assistant.reasoning","delta_batch"],"action":"","refs":[{"label":"AssistantReasoningData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L3504-L3511"},{"label":"AssistantReasoningDeltaData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L3517-L3521"}]},"C5":{"id":"C5","surface":"Chat","element":"Activity group (tool rows)","kind":"SDK + Harness","status":"SV+INF","shows":"One row per tool call: icon, verb, argument summary, duration.","source":"Row opens on `tool.execution_start{tool_call_id, tool_name, tool_title, arguments, shell_tool_info.display_command}` and closes on `tool.execution_complete{tool_call_id, success, error, file_edits}`. Verb = harness table keyed by `tool_name`; built-in names are read at runtime from `rpc().tools().get_builtin_descriptors()` (method SV, names UNV, probe V8). Argument = `tool_title`, else `display_command`, else first path in `arguments`. Duration = difference of the two envelopes' `SessionEvent.timestamp`. '+N −M' on edit rows comes from D9.","updates":["tool_started","tool_finished"],"action":"","refs":[{"label":"ToolExecutionStartData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L4600-L4658"},{"label":"ToolExecutionCompleteData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L5198-L5277"},{"label":"SessionEvent.timestamp","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L6181-L6203"},{"label":"tools.get_builtin_descriptors","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L17669"}]},"C6":{"id":"C6","surface":"Chat","element":"Assistant text","kind":"SDK","status":"SV","shows":"The assistant's reply, rendered as markdown.","source":"Final text = `assistant.message{message_id, content}`. While streaming, `assistant.message_delta{message_id, delta_content}` is merged by the harness into ephemeral `delta_batch` frames (flush every 50 ms or 4 KiB).","updates":["copilot:assistant.message","delta_batch"],"action":"","refs":[{"label":"AssistantMessageData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L3771-L3863"},{"label":"AssistantMessageDeltaData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L3880-L3889"}]},"C7":{"id":"C7","surface":"Chat","element":"Turn footer (duration · tokens)","kind":"SDK + Harness","status":"SV+INF","shows":"Wall time of the turn, tokens it used, and the share of input served from the provider's prompt cache.","source":"Duration = `assistant.turn_end.timestamp − assistant.turn_start.timestamp` joined on `turn_id` (SV). Tokens = Σ `input_tokens + output_tokens` of the `assistant.usage` events received between them; cached share = Σ `cache_read_tokens` / Σ `input_tokens` (fields SV, join INF; whether `input_tokens` already includes cache reads is probe V17).","updates":["copilot:assistant.turn_end","copilot:assistant.usage"],"action":"","refs":[{"label":"AssistantUsageData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L4005-L4119"},{"label":"AssistantTurnStartData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L3191-L3202"},{"label":"AssistantTurnEndData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L3895-L3903"},{"label":"AssistantUsageData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L4005-L4207"}]},"C8":{"id":"C8","surface":"Chat","element":"Inline agent card (spawned subagent or teammate)","kind":"Harness + SDK","status":"SV+INF","shows":"Kind, name, task, status, current activity, step progress, branch, context %, elapsed time, tokens, model; buttons Open, Message, Stop.","source":"Anchored where the parent called `spawn_agent`: `ToolInvocation.tool_call_id` (SV) is stored as `AgentRecord.spawned_by_call`. Fields: status D1, activity D2, step D3, context D5, elapsed D6, tokens D7, task from the board, branch from `Workspace`.","updates":["agent_spawned","agent_status","task_changed","scratch_todos","usage","copilot:assistant.intent","agent_resumed"],"action":"Open → focus the agent (client). Message → sets composer target (K3). Stop (two-step) → harness `agent_stop` → `Session::abort()`, then `rpc().sessions().close(..)` once `session.idle` arrives; owned tasks return to `pending`; agent becomes `cancelled`.","refs":[{"label":"ToolInvocation","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L6246-L6252"},{"label":"Session::abort","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/session.rs#L1109"},{"label":"sessions.close","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L5967"}]},"C9":{"id":"C9","surface":"Chat","element":"Finished subagent result","kind":"Harness","status":"INF","shows":"Short result of a finished agent; 'Full report' expands it.","source":"`TaskResult.summary` (≤ 2 KiB) parsed from the child's final `assistant.message` using the fixed headings SUMMARY / EVIDENCE / CHANGES / RISKS / BLOCKERS; the full text is a blob.","updates":["agent_status","task_changed"],"action":"'Full report' fetches `GET /api/blobs/{sha}`.","refs":[]},"C10":{"id":"C10","surface":"Chat","element":"Approved plan card","kind":"Harness","status":"INF","shows":"Plan version, task rows (id, title, owner, dependencies), who approved and when.","source":"`PlanVersion{version, markdown, ops, state: approved, decided}` created when the orchestrator called `submit_plan`; rows from its `TaskSpec`s after ids were assigned.","updates":["plan_version_created","plan_decided"],"action":"Header toggles the row list (client).","refs":[]},"C11":{"id":"C11","surface":"Chat","element":"Re-plan card awaiting approval","kind":"Harness + SDK","status":"SV+INF","shows":"Proposed version, reason, '+' rows for added tasks, rows whose dependencies change; Approve / Edit plan / Reject.","source":"`PlanVersion` N+1 from the orchestrator's `propose_plan_change` (state `awaiting_approval`). '+' rows = `Add` ops; changed dependencies = `Rewire` ops.","updates":["plan_version_created","plan_decided"],"action":"Approve → `plan_decide{version, approve}` → board applies ops (`task_created`, `task_changed`) and a `Notify{PlanApproved}` mail reaches the orchestrator via `Session::send(MessageOptions{mode: Enqueue})`. Edit → Plan tab (P1). Reject → `plan_decided{rejected{feedback}}` plus `Notify{PlanRejected}`.","refs":[{"label":"DeliveryMode","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L5915-L5919"},{"label":"Session::send","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/session.rs#L842"}]},"C12":{"id":"C12","surface":"Chat","element":"Ask card ('Needs your answer')","kind":"Harness + SDK","status":"SV+INF","shows":"A child's question that reached the user, with choices and a free-text reply.","source":"An `Ask` mail. It originates from the harness `ask` tool, or from Copilot's built-in ask-user, which calls the harness `UserInputHandler` with `user_input.requested{question, choices, allow_freeform}` (SV). It reaches the user when the parent calls `ask{forward: <mail id>}`, or when the parent is idle or `InputRequired` and has not answered within 120 s of its next wake.","updates":["mail_created","mail_state","agent_status"],"action":"Choice or reply → `answer_ask{mail_id, text}` → `Answer` mail delivered to the asker with `Session::send(… mode: Enqueue)`. If the ask came through `UserInputHandler` and is answered within 60 s, the pending handler returns `UserInputResponse{answer, was_freeform}` (SV) instead; after 60 s the handler has already returned \"no answer yet\" and the answer goes by `Enqueue`.","refs":[{"label":"UserInputRequestedData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L7631-L7644"},{"label":"UserInputResponse","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/handler.rs#L149"},{"label":"UserInputHandler","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/handler.rs#L303"}]},"C13":{"id":"C13","surface":"Chat","element":"Permission card","kind":"SDK + Harness","status":"SV+UNV","shows":"Which agent wants to run what, why, in which worktree; Deny / Always allow in this worktree / Allow once; a bar that drains until auto-deny (C27). Like the other cards waiting on the user (C12, and C8 while its agent needs permission) it has an amber left edge; it glows once when it first appears.","source":"Created when the SDK calls `PermissionHandler::handle(session_id, request_id, PermissionRequestData{kind, tool_call_id, extra})` (SV). Command text, intention and paths are parsed from `extra` into the generated `PermissionRequestShell{full_command_text, intention, possible_paths, can_offer_session_approval}` (field names SV; the SDK documents that `extra` varies by CLI version, so parsing is probe V6). Worktree = the agent's `Workspace`.","updates":["permission"],"action":"Allow once → `PermissionResult::approve_once()` (SV). Always allow in worktree → `PermissionDecision::ApproveForLocation{location_key, …}` (variant SV, `location_key` meaning UNV, probe V11) or, as fallback, a harness rule plus `approve_once`. Deny → `PermissionResult::reject(feedback)` (SV). Decision 10: with no click after 90 s the handler returns `reject(\"waiting for user approval; you will be told when to retry\")`; the card switches to 'Approve & retry', which stores the rule and sends the agent a `Directive` via `Enqueue`.","refs":[{"label":"PermissionHandler","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/handler.rs#L204-L211"},{"label":"PermissionResult","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/handler.rs#L54-L131"},{"label":"PermissionRequestData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L6701"},{"label":"PermissionRequestShell","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L6050-L6075"},{"label":"PermissionDecision variants","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/api_types.rs#L48897-L48903"},{"label":"PermissionCompletedData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L7304-L7327"}]},"C14":{"id":"C14","surface":"Chat","element":"Inline mail row","kind":"Harness","status":"INF","shows":"A message between two agents: sender, recipient, kind, time, delivery state.","source":"`MailMessage{from, to, kind, summary, state}`. Shown in the sender's and recipient's transcripts, and in the lead transcript when both parties are in its subtree.","updates":["mail_created","mail_state"],"action":"","refs":[]},"C15":{"id":"C15","surface":"Chat","element":"Steer bubble with delivery line","kind":"Harness + SDK","status":"SV+UNV","shows":"A user message to a non-lead agent and how it was delivered.","source":"`Steer` mail. Delivery line = D10 over `DeliveryState`: `held` → `submitted` (when `Session::send` returns its message id, SV) → `in_context{delivery}` when `user.message.delivery` is `idle | steering | queued` (SV). Matching the send's id to `user.message.message_id` is probe V3.","updates":["mail_created","mail_state","copilot:user.message"],"action":"","refs":[{"label":"UserMessageDelivery","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L10046-L10059"},{"label":"UserMessageData.message_id","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L3159"}]},"C16":{"id":"C16","surface":"Chat","element":"Compaction divider","kind":"SDK + Harness","status":"SV+INF","shows":"Context compaction: utilisation when it started, tokens before and after, messages removed, and what the summarizer call cost (tokens in, cached, out, duration). A failed compaction shows its error and the failure count toward RT1.","source":"`session.compaction_start{trigger, current_tokens, token_limit}` and `session.compaction_complete{success, error, pre_compaction_tokens, post_compaction_tokens, messages_removed, summary_content, compaction_tokens_used{input_tokens, output_tokens, cache_read_tokens, duration}}` (SV), normalized to the `Compaction` EventKind. 'k of 2 failed' = `CopilotBinding.failed_compactions_in_a_row` against RT1 (harness). 'View summary' opens the `summary_content` blob.","updates":["compaction","usage"],"action":"'View summary' fetches the `summary_content` blob.","refs":[{"label":"SessionCompactionStartData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L2466-L2487"},{"label":"SessionCompactionCompleteData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L2579-L2648"},{"label":"CompactionCompleteCompactionTokensUsed","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L2527-L2562"},{"label":"CompactionTrigger","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L9660-L9679"}]},"C17":{"id":"C17","surface":"Chat","element":"Session rotation divider","kind":"Harness","status":"INF","shows":"The agent moved to a new Copilot session (generation) after a rescue trigger, which trigger, and the handoff size in tokens.","source":"`agent_rotated{from_generation, to_session, trigger: RT1 | RT2 | RT3 | RT4, handoff, handoff_tokens}` (section 4.3). Handoff ≤ 8 KiB = last `compaction_complete.summary_content` (SV field, reused at no extra cost) + owned tasks, mail summaries, private checklist, last assistant message, `git diff --stat`, edited paths. The old session is closed with `rpc().sessions().close` (SV).","updates":["agent_rotated"],"action":"'View handoff' fetches the blob.","refs":[{"label":"summary_content","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L2633"},{"label":"sessions.close","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L5967"}]},"C18":{"id":"C18","surface":"Chat","element":"Task brief (top of an agent view)","kind":"Harness + SDK","status":"SV+INF","shows":"The instructions the parent gave when spawning, plus what context, tools and workspace the agent got.","source":"The spawn `Directive` mail (= `spawn_agent.prompt`). Tools line = the agent's `SessionConfig.available_tools` / `excluded_tools` (SV). Workspace = `SessionConfig.working_directory` (SV).","updates":["agent_spawned","mail_created"],"action":"","refs":[{"label":"SessionConfig.available_tools / excluded_tools","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L2122-L2124"},{"label":"SessionConfig.working_directory","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L2336"}]},"C19":{"id":"C19","surface":"Chat","element":"Private checklist","kind":"Harness","status":"INF","shows":"The agent's own step list; not on the task board.","source":"Harness tool `todo_write` (whole-list replace; one writer) → `AgentRecord.scratch`.","updates":["scratch_todos"],"action":"","refs":[]},"C20":{"id":"C20","surface":"Chat","element":"Diff card","kind":"SDK + Harness","status":"SV+INF","shows":"Lines changed by one edit, with file name and +/− counts.","source":"Triggered by `tool.execution_complete.file_edits[{kind, path}]` (SV). The event carries no line counts, so D9 computes the diff.","updates":["tool_finished"],"action":"","refs":[{"label":"ToolExecutionCompleteFileEdit","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L4732-L4736"},{"label":"ToolExecutionCompleteData.file_edits","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L5211"}]},"C21":{"id":"C21","surface":"Chat","element":"'Asked orchestrator' card (agent view)","kind":"Harness","status":"INF","shows":"The agent's own outstanding question and whether it was forwarded or answered.","source":"The agent's `Ask` mail and its `DeliveryState` / linked `Answer`.","updates":["mail_created","mail_state"],"action":"","refs":[]},"C22":{"id":"C22","surface":"Chat","element":"Streaming text and caret","kind":"SDK","status":"SV","shows":"Text arriving live.","source":"Ephemeral `delta_batch` built from `assistant.message_delta.delta_content` (SV). The caret disappears when `assistant.message` with the same `message_id` arrives. Deltas never enter the durable log.","updates":["delta_batch","copilot:assistant.message"],"action":"","refs":[{"label":"AssistantMessageDeltaData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L3880-L3889"}]},"C23":{"id":"C23","surface":"Chat","element":"'Result returned to parent' divider","kind":"Harness","status":"INF","shows":"The agent finished and its result went to the parent.","source":"`agent_status{completed}` and the `Notify{AgentCompleted}` mail to the parent.","updates":["agent_status","mail_created"],"action":"","refs":[]},"C24":{"id":"C24","surface":"Chat","element":"Idle note","kind":"Harness","status":"INF","shows":"Why an agent is idle.","source":"D1 = idle plus the board: owned tasks that are not ready and the tasks they wait on.","updates":["agent_status","task_changed"],"action":"","refs":[]},"C25":{"id":"C25","surface":"Chat","element":"Status line under the transcript","kind":"Harness","status":"INF","shows":"What the focused agent is doing right now.","source":"D1 for the focused agent. In the lead view: children that are running or waiting on the user.","updates":["agent_status","permission","mail_state"],"action":"","refs":[]},"C26":{"id":"C26","surface":"Chat","element":"Connection banner","kind":"Harness","status":"INF","shows":"The only place a lost link is reported: the UI's stream to the harness, or the harness's Copilot CLI process (S6). While it shows, every other element keeps its last known value, stops animating and refuses commands; the panel header shows the seq the state is from.","source":"Stream state of `WS /api/runs/{run}/stream`: a `stream.end{reason, last_seq, retryable}` frame or a socket close sets it down. While `retryable`, the client reconnects with `since_seq = last_seq + 1` after 2, 4, 8 and 16 s, then every 30 s; replay follows section 10.2. A CLI exit arrives as a `health` envelope from the supervisor, which resumes sessions on its own (section 4.4).","updates":["health"],"action":"Retry now reconnects immediately. Diagnostics opens the Event log tab (E4). The chevron shows the reason, last seq, resume URL and backoff. Commands clicked while offline are refused with a toast and are never queued.","refs":[]},"C27":{"id":"C27","surface":"Chat","element":"Auto-deny countdown bar","kind":"Harness","status":"INF","shows":"Time left before the harness auto-denies an open permission request: a thin bar across the top of C13 that drains over the 90 s window. Screen readers get the same time as text ('auto-denies in m:ss'). The bar stops while the connection banner C26 shows and goes away when the request is decided or times out.","source":"`PendingPermission{opened_ms, state: open}` from the `Permission(..)` envelope (section 7.5). Time left = `opened_ms` + 90 000 − now, where now is the latest envelope's `ts_ms` plus local time elapsed since it arrived, so a skewed client clock does not move the bar. The harness, not the client, ends the window: it returns `reject(feedback)` and emits `Permission(..)` with `state: timed_out`.","updates":["permission"],"action":"","refs":[]},"K1":{"id":"K1","surface":"Composer","element":"Changes strip (worktrees · files · +/−)","kind":"Git","status":"INF","shows":"Total uncommitted and committed change across writer worktrees since their base commit.","source":"For each writer worktree: `git -C <wt> diff --numstat <base_commit>` plus `git status --porcelain` (untracked files count as added). Recomputed, debounced 1 s, after any `tool.execution_complete` that has non-empty `file_edits` (SV) or comes from a shell tool (shell writes are not listed in `file_edits`, probe V15).","updates":["tool_finished"],"action":"Click opens the Worktrees tab.","refs":[{"label":"ToolExecutionCompleteData.file_edits","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L5211"}]},"K2":{"id":"K2","surface":"Composer","element":"Queued messages strip","kind":"Harness + SDK","status":"SV+UNV","shows":"Messages the user sent that are queued in an agent's Copilot session; Send now / Retract.","source":"Mail in state `submitted` not yet seen as `user.message`. On every `pending_messages.modified` the harness calls `rpc().queue().pending_items()` and emits `mail_state` envelopes; queue items carry the send's `message_id` (both SV; the queue namespace is experimental).","updates":["mail_state"],"action":"Send now → `rpc().queue().send_now({id})` with the queue item id from `pending_items()` (SV). Retract → `rpc().queue().withdraw_message{message_id, expected_prompt}` (SV), using the send id and the prompt stored in `DeliveryState::Submitted`.","refs":[{"label":"queue.pending_items","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L15594"},{"label":"queue.send_now","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L15908"},{"label":"queue.withdraw_message","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L15780"},{"label":"queue.remove_at","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L15714"},{"label":"QueueWithdrawMessageRequest","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/api_types.rs#L22371-L22375"}]},"K3":{"id":"K3","surface":"Composer","element":"'To' target picker","kind":"Client","status":"CLIENT","shows":"Which agent the message goes to, with each agent's status.","source":"Client list over `AgentRecord`s with D1. Typing `@agent-id ` at the start of the message also sets the target.","updates":["agent_status"],"action":"","refs":[]},"K4":{"id":"K4","surface":"Composer","element":"Target hint text","kind":"Client","status":"CLIENT","shows":"How the message will land given the target's state.","source":"From D1 of the target and the K5 toggle: idle → 'starts a new turn'; running + steer → 'steers the current turn'; running + queue → 'queued for the next turn'.","updates":["agent_status"],"action":"","refs":[]},"K5":{"id":"K5","surface":"Composer","element":"'Steer now' toggle","kind":"SDK","status":"SV","shows":"Whether a message to a running agent interrupts its current turn.","source":"On → `MessageOptions.mode = Some(DeliveryMode::Immediate)`; the echo arrives as `user.message.delivery = steering`. Off → `Enqueue`, echo `queued`. Default on for user → running agent. To an idle agent the mode does not matter; the echo is `idle`.","updates":[],"action":"","refs":[{"label":"DeliveryMode","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L5915-L5919"},{"label":"MessageOptions.mode","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L5984"}]},"K6":{"id":"K6","surface":"Composer","element":"Message input","kind":"SDK","status":"SV","shows":"Text to send.","source":"Becomes `MessageOptions.prompt`. Mail from agents is wrapped in a `<mail …>` envelope and `display_prompt` carries the human-readable text.","updates":[],"action":"Enter sends (K11).","refs":[{"label":"MessageOptions","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L5970-L6010"}]},"K7":{"id":"K7","surface":"Composer","element":"Attach button","kind":"SDK","status":"SV","shows":"Attach files or images.","source":"`MessageOptions.attachments`.","updates":[],"action":"","refs":[{"label":"MessageOptions.attachments","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L5990"}]},"K8":{"id":"K8","surface":"Composer","element":"Plan gate indicator","kind":"Config + SDK","status":"SV+INF","shows":"Plans and re-plans wait for user approval (always on; decision 6).","source":"The orchestrator starts in plan mode with `MessageOptions.agent_mode = Plan` or `rpc().mode().set(…)` (SV) and gets only read-only tools plus `submit_plan`.","updates":[],"action":"","refs":[{"label":"AgentMode","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L5929-L5937"},{"label":"mode.set","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L13298"}]},"K9":{"id":"K9","surface":"Composer","element":"Model chip","kind":"SDK","status":"SV","shows":"Model of the target agent's session.","source":"`SessionConfig.model` at creation (required with BYOK per docs); changed with `Session::set_model`; observed as `session.model_change{new_model}`.","updates":["copilot:session.model_change"],"action":"","refs":[{"label":"SessionConfig.model","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L2073"},{"label":"Session::set_model","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/session.rs#L1122"},{"label":"SessionModelChangeData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L1591-L1647"}]},"K10":{"id":"K10","surface":"Composer","element":"Role pill","kind":"Harness","status":"INF","shows":"lead / teammate / subagent.","source":"`AgentRecord.kind`.","updates":[],"action":"","refs":[]},"K11":{"id":"K11","surface":"Composer","element":"Send button","kind":"Harness + SDK","status":"SV+INF","shows":"Sends the message.","source":"To the orchestrator → command `user_message` → `Session::send` (SV). To any other agent → command `send_mail{to, kind: steer, urgency}` → mailbox → `Session::send`. Acknowledged only after the log write commits.","updates":["user_message","mail_created"],"action":"","refs":[{"label":"Session::send","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/session.rs#L842"}]},"K12":{"id":"K12","surface":"Composer","element":"Turn stats line","kind":"Harness + SDK","status":"SV+INF","shows":"For the focused agent: turns in its current generation, steps in the current turn, output rate while it streams, tokens and cache share, and its context ring (H6).","source":"Turns = count of `assistant.turn_start` (SV) in the current generation. Steps = D13 spans since the latest `assistant.turn_start`. Output rate = `assistant.message_delta` characters per second over the last 5 s, converted with the model's tokens-per-character estimate; hidden when the agent is not streaming. Tokens and cache share = D7.","updates":["tool_started","tool_finished","delta_batch","usage","copilot:assistant.turn_start","copilot:assistant.usage"],"action":"","refs":[]},"A1":{"id":"A1","surface":"Agents tab","element":"Status summary chips","kind":"Harness","status":"INF","shows":"How many agents are running, blocked on the user, idle.","source":"Counts over D1.","updates":["agent_status","permission","mail_state"],"action":"","refs":[]},"A2":{"id":"A2","surface":"Agents tab","element":"Agent row","kind":"Harness + SDK","status":"SV+INF","shows":"Name, task, status, activity, context meter, model, generation; Message and Stop.","source":"`AgentRecord` + D1, D2, D5. Meter ticks sit at D11 (the agent's `background_compaction_threshold`) and at `buffer_exhaustion_threshold` 0.95 (fields SV). Generation = `CopilotBinding.generation`; it changes only on the rescue triggers RT1–RT4 of section 4.3.","updates":["agent_status","usage","agent_rotated","copilot:assistant.intent","agent_resumed"],"action":"Row focuses the agent. Message → K3. Stop → as C8.","refs":[{"label":"InfiniteSessionConfig","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/types.rs#L1001-L1012"}]},"A3":{"id":"A3","surface":"Agents tab","element":"Team / subagent grouping","kind":"Harness","status":"INF","shows":"Long-lived teammates versus fire-and-forget subagents.","source":"`AgentRecord.kind`: `orchestrator` and `teammate` versus `quick`.","updates":["agent_spawned"],"action":"","refs":[]},"L1":{"id":"L1","surface":"Run tab","element":"Run summary tiles","kind":"Harness","status":"INF","shows":"Elapsed time since the run started, agents and how many are live, tokens and prompt-cache share across all agents, and the total time at least one item was waiting on the user.","source":"Elapsed = now − `ts_ms` of the run's first envelope. Agents and live = S2. Tokens and cache share = Σ D7 over all agents. Waiting on you = length of the union of all needs-you spans (D13); 'open now' = D8.","updates":["agent_spawned","agent_status","permission","mail_state","plan_decided","copilot:assistant.usage"],"action":"","refs":[]},"L2":{"id":"L2","surface":"Run tab","element":"Agent lanes","kind":"Harness","status":"INF","shows":"One lane per agent from spawn to now. Bars show what the agent was doing (model, tool, waiting, needs you); an amber underline marks time an item from that lane waited on the user; diamonds mark compaction, rotation, steering and messages; the teal line is now.","source":"D13 spans per agent, laid out on one time axis. 'Whole run' runs from the first envelope to the next 10-minute mark after now; 'Last 10 min' ends at the next minute. Spans narrower than 2 px are drawn 2 px wide.","updates":["agent_spawned","agent_status","tool_started","tool_finished","permission","mail_created","mail_state","plan_version_created","plan_decided","compaction","agent_rotated","copilot:assistant.turn_start","copilot:assistant.turn_end","copilot:session.idle"],"action":"Clicking a lane opens that agent. Hovering a span shows its label, start, end and duration. The Whole run / Last 10 min switch is client-only.","refs":[]},"L3":{"id":"L3","surface":"Run tab","element":"Turn steps of the focused agent","kind":"Harness","status":"INF","shows":"The focused agent's current turn, or its last one, as steps: model calls, tool calls, blocking waits and approval waits, each with its duration and its position inside the turn.","source":"D13 spans from the agent's latest `assistant.turn_start` to its `assistant.turn_end`, or to now while the turn runs. After an orchestrator turn ends, its waiting span is shown as the last step. Turn number = count of `assistant.turn_start` in the agent's current generation. Tool labels: `tool_title`, else `tool_name` with its main argument.","updates":["tool_started","tool_finished","permission","copilot:assistant.turn_start","copilot:assistant.turn_end"],"action":"","refs":[]},"T1":{"id":"T1","surface":"Task board tab","element":"Board header","kind":"Harness","status":"INF","shows":"Approved plan version and done / total.","source":"Latest approved `PlanVersion.version`; counts over tasks not in `proposed`.","updates":["plan_decided","task_changed"],"action":"Graph / List switch (client).","refs":[]},"T2":{"id":"T2","surface":"Task board tab","element":"Dependency graph","kind":"Client","status":"CLIENT","shows":"Tasks as nodes, dependencies as edges, proposed tasks dashed.","source":"Client layout over the board: layer = longest path along `blocked_by`; edges = `blocked_by`; node label = D4.","updates":["task_created","task_changed"],"action":"Clicking a node switches to List.","refs":[]},"T3":{"id":"T3","surface":"Task board tab","element":"Task list","kind":"Harness","status":"INF","shows":"Tasks grouped by display status, with owner, dependencies and acceptance text.","source":"Board `Task{id, title, owner, blocked_by, acceptance, status}` with D4.","updates":["task_created","task_changed","task_ready"],"action":"","refs":[]},"P1":{"id":"P1","surface":"Plan tab","element":"Plan document","kind":"Harness + SDK","status":"SV+INF","shows":"The plan markdown and its task table.","source":"`PlanVersion.markdown`, stored by the harness (source of truth). Mirrored into the orchestrator's Copilot session with `rpc().plan().update(…)` (SV) so the model's native plan context matches; never read back as truth.","updates":["plan_version_created","plan_decided"],"action":"","refs":[{"label":"plan.update","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L14645"}]},"P2":{"id":"P2","surface":"Plan tab","element":"Version history","kind":"Harness","status":"INF","shows":"Every plan version with state and decision time.","source":"`Plan.versions[*]{version, state, authored_by, decided}`.","updates":["plan_version_created","plan_decided"],"action":"","refs":[]},"P3":{"id":"P3","surface":"Plan tab","element":"Approve / Edit / Reject","kind":"Harness","status":"INF","shows":"Decision controls for the open version.","source":"Commands `plan_decide` and `plan_edit` (see C11).","updates":[],"action":"Edit opens the markdown and task table for editing; saving sets `user_edited = true` on the version.","refs":[]},"M1":{"id":"M1","surface":"Mailbox tab","element":"Filter chips","kind":"Client","status":"CLIENT","shows":"Filter by message kind.","source":"Client filter on `MailKind`.","updates":[],"action":"","refs":[]},"M2":{"id":"M2","surface":"Mailbox tab","element":"Mail item","kind":"Harness","status":"INF","shows":"Sender, recipient, kind, time, text, delivery state, seq.","source":"`MailMessage` with D10 and the envelope `seq` of its last state change.","updates":["mail_created","mail_state"],"action":"","refs":[]},"E1":{"id":"E1","surface":"Event log tab","element":"Durable log head","kind":"Harness","status":"INF","shows":"Highest committed sequence number and whether this client is caught up.","source":"Last `seq` committed by the single log writer; 'in sync' when the client's last received seq equals it.","updates":["*"],"action":"","refs":[]},"E2":{"id":"E2","surface":"Event log tab","element":"On-disk size","kind":"Harness","status":"INF","shows":"Bytes used by the run's log.","source":"Σ sizes of segments, snapshots and blobs from `GET /api/runs/{run}/log/stats` (filesystem metadata, refreshed on `snapshot_written` and every 10 s).","updates":["snapshot_written"],"action":"","refs":[]},"E3":{"id":"E3","surface":"Event log tab","element":"UI window","kind":"Client","status":"CLIENT","shows":"How many envelopes the UI holds in memory (cap 4,096).","source":"Client counter. When full, the oldest envelopes are dropped from memory; scrolling back re-fetches them (C1).","updates":["*"],"action":"","refs":[]},"E4":{"id":"E4","surface":"Event log tab","element":"Lag resyncs","kind":"Harness + SDK","status":"SV+INF","shows":"How often this client or the harness's Copilot reader fell behind, and where recovery started.","source":"Client: count of `resync` frames received. Harness: each `cursor_status: expired` from the single `event_log().read` loop (SV) is recorded as `resync`, and each gap in ephemeral events (which cannot be replayed) as `health`; with the `subscribe()` fallback, each `Lagged(n)` (SV) is recorded as `health{lagged: n}`.","updates":["resync","health"],"action":"","refs":[{"label":"EventsReadResult.cursor_status","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/api_types.rs#L8386-L8396"}]},"E5":{"id":"E5","surface":"Event log tab","element":"Context per agent","kind":"SDK","status":"SV","shows":"D5 for every agent, with ticks at D11 and 95%.","source":"Latest `session.usage_info` per agent (see H6).","updates":["usage"],"action":"","refs":[{"label":"SessionUsageInfoData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L2431-L2449"}]},"E6":{"id":"E6","surface":"Event log tab","element":"Segments, snapshots, blobs","kind":"Harness","status":"INF","shows":"Files in the run's log directory.","source":"Listing from `GET /api/runs/{run}/log/stats`: segments roll at 64 MiB or 200,000 events; snapshot every 10,000 events, last 3 kept; payloads over 8 KiB go to blobs.","updates":["snapshot_written"],"action":"","refs":[]},"E7":{"id":"E7","surface":"Event log tab","element":"Live tail","kind":"Harness","status":"INF","shows":"Last 10 envelopes on this client's stream.","source":"Columns: `seq`, agent, type, detail. Type = `Origin::Copilot.event_type` (the SDK wire name, e.g. `tool.execution_start`) or the harness `EventKind` (e.g. `task_changed`). Includes ephemeral `delta_batch` frames, which are not stored.","updates":["*"],"action":"","refs":[]},"G1":{"id":"G1","surface":"Worktrees tab","element":"Base commit","kind":"Harness","status":"INF","shows":"Commit every worktree was created from.","source":"`Workspace::Worktree.base_commit`, recorded when the harness ran `git worktree add`.","updates":["agent_spawned"],"action":"","refs":[]},"G2":{"id":"G2","surface":"Worktrees tab","element":"Changed files per worktree","kind":"Git","status":"INF","shows":"Status letter, path and +/− per file.","source":"`git -C <wt> diff --numstat <base_commit>` and `git status --porcelain`.","updates":["tool_finished"],"action":"","refs":[]},"W1":{"id":"W1","surface":"Code view","element":"Explorer (worktree file tree)","kind":"Harness","status":"INF","shows":"Files of the chosen worktree, with each changed file's status letter and a dot on collapsed folders that hold changes. Chips pick an agent worktree or the main checkout.","source":"`GET /api/runs/{run}/worktrees` for branch, base commit and changed files (G1, G2). The full file list is `git -C <wt> ls-files` plus untracked files from `git status --porcelain`, served in the same response.","updates":["agent_spawned","tool_finished"],"action":"Clicking a folder expands it (client); clicking a file opens it in the editor (W3).","refs":[]},"W2":{"id":"W2","surface":"Code view","element":"Changes list","kind":"Harness","status":"INF","shows":"Every changed file across agent worktrees, grouped by branch, with +/− counts.","source":"Same data as G2.","updates":["tool_finished"],"action":"Click opens the file from that worktree.","refs":[]},"W3":{"id":"W3","surface":"Code view","element":"Editor tabs and path bar","kind":"Harness","status":"INF","shows":"Open files, the active file's path, worktree, size and +/− counts, and a 'read-only' badge (the UI never writes files; agents do). Shows '<agent> is editing' while that agent's running turn has edited the file.","source":"Tabs are client state. 'is editing' = the path is in `file_edits` of a `tool.execution_complete` (SV) in the agent's current turn, and D1 is running.","updates":["tool_finished","agent_status"],"action":"Tabs switch or close files (client).","refs":[]},"W4":{"id":"W4","surface":"Code view","element":"File content","kind":"Harness","status":"INF","shows":"The file as it is in the chosen worktree, highlighted, with gutter marks on lines the agent's latest edit added or changed.","source":"`GET /api/runs/{run}/worktrees/{agent}/file?path=` returns `{path, rev, size, content}`; files over 256 KiB come back as a blob hash read through `/api/blobs/{sha256}`. Gutter marks come from the latest per-edit diff D9 of that path.","updates":["tool_finished"],"action":"","refs":[]},"W5":{"id":"W5","surface":"Code view","element":"File / Diff switch and diff view","kind":"Harness","status":"INF","shows":"The latest per-edit diff of the file.","source":"D9 blobs for the path, newest first.","updates":["tool_finished"],"action":"The File / Diff switch is client-only.","refs":[]},"W6":{"id":"W6","surface":"Code view","element":"'Open in editor' button","kind":"Client","status":"CLIENT","shows":"Opens the worktree file in the user's local editor.","source":"Placeholder in the mockup; a desktop shell would hand the worktree path to the OS.","updates":[],"action":"","refs":[]},"B1":{"id":"B1","surface":"Background tab","element":"Background job card","kind":"SDK + Harness","status":"SV+INF","shows":"One card per background shell: description, command, owner agent, status, elapsed time, pid, attached or detached, and a listening port when one is seen.","source":"Per agent session, `tasks().list()` (SV, experimental) returns entries tagged by `type`. `type: \"shell\"` entries parse as `TaskShellInfo{id, command, description, status, execution_mode, attachment_mode, pid, log_path, started_at, completed_at}` (SV). The harness re-lists a session when `session.background_tasks_changed` arrives (empty payload, SV) and diffs the result into `bg_job_started` / `bg_job_exited`, keyed by (agent, task id), so finished jobs outlive the session, a rotation and a CLI restart (INF). Elapsed = now − `started_at`, frozen at `completed_at`. The port is parsed from the output ('listening on …:N') and is only a hint (CLIENT). `type: \"agent\"` entries (`TaskAgentInfo`) are not shown here, because the harness spawns its own subagents.","updates":["bg_job_started","bg_job_exited","bg_job_removed","copilot:session.background_tasks_changed"],"action":"More output expands the tail (B2). Message opens the composer to the owner.","refs":[{"label":"tasks.list","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L17201"},{"label":"TaskShellInfo","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/api_types.rs#L29613-L29643"},{"label":"SessionBackgroundTasksChangedData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L8342-L8345"},{"label":"TaskShellInfoAttachmentMode","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/api_types.rs#L51571-L51582"}]},"B2":{"id":"B2","surface":"Background tab","element":"Live output tail","kind":"SDK + Harness","status":"SV+UNV","shows":"The last lines a background shell printed: 3 on a running card, 2 on a failed one, 14 when expanded.","source":"Attached shells stream `tool.shell_output{tool_call_id, sequence, stream, text}` (SV). It is ephemeral (not persisted, not replayed to late subscribers), so the harness appends each chunk to a per-job tail blob capped at 64 KiB and forwards `bg_job_output` frames that are drawn but never stored, like `delta_batch` (INF). On first paint or after a gap the tail is refilled from `tasks().get_progress({id})` → `TaskShellProgress{pid, recent_output}` (SV). Detached shells have no stream; the harness tails `log_path` (SV field). Whether `tool.shell_output` keeps flowing after the starting tool call has returned is probe V19.","updates":["bg_job_output","copilot:tool.shell_output"],"action":"Full output: `GET /api/runs/{run}/jobs/{job}/output`.","refs":[{"label":"ToolShellOutputData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L4673-L4686"},{"label":"tasks.getProgress","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L17343"},{"label":"TaskShellProgress","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/api_types.rs#L29655-L29663"}]},"B3":{"id":"B3","surface":"Right rail, sidebar, agents","element":"Background count","kind":"Harness","status":"INF","shows":"How many background shells are running: a badge on the right rail's Background button, and a per-agent count on the sidebar, agent rows and task cards. All of them show only with Details on.","source":"Jobs in the harness projection whose D12 status is Running or Idle, grouped by owner. Finished jobs are not counted.","updates":["bg_job_started","bg_job_exited","agent_status"],"action":"Click opens the Background view.","refs":[]},"B4":{"id":"B4","surface":"Background tab","element":"Stop and Clear","kind":"SDK + Harness","status":"SV+INF","shows":"Stop on a running job (two clicks) and Clear on the Finished group.","source":"Stop sends `job_stop{job_id}` → `tasks().cancel({id})` (SV) on the owner's session. The job ends as Stopped and the owner gets a `Notify` mail. If `cancelled` is false and the job is detached with a `pid`, the harness kills the process group (INF). Clear sends `job_clear` → `tasks().remove({id})` (SV) per finished job; the harness keeps its records and output blobs. `agent_stop` cancels the agent's running jobs before `abort()` (INF).","updates":["bg_job_exited"],"action":"Stop: the first click arms, the second cancels. Clear: hides finished jobs from the tab.","refs":[{"label":"tasks.cancel","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L17470"},{"label":"tasks.remove","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L17500"}]},"B5":{"id":"B5","surface":"Chat","element":"'Started in background' card","kind":"SDK + Harness","status":"SV+UNV","shows":"In the owner's transcript: the shell call that started a background job, its live status, elapsed time and last output lines.","source":"The `tool.execution_start` row (C5) whose `shell_tool_info.display_command` matches a new `TaskShellInfo.command` with `execution_mode: background` (SV fields). The harness links the call and the job through `bg_job_started.tool_call_id` (INF). That `TaskShellInfo.id` can be matched to the tool call is probe V19; the fallback is command text plus start time. A sync shell moved to the background with `tasks().promote_to_background({id})` (SV) gets the same card.","updates":["tool_started","bg_job_started","bg_job_exited"],"action":"Show in Background opens the tab at this job. Stop as in B4.","refs":[{"label":"tasks.promoteToBackground","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/rpc.rs#L17404"},{"label":"TaskShellInfo.execution_mode","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/api_types.rs#L29626-L29628"}]},"B6":{"id":"B6","surface":"Chat","element":"Background job exit divider","kind":"Harness + SDK","status":"INF+UNV","shows":"A divider in the owner's transcript when a job leaves Running: exit code, duration, and how the owner was told.","source":"`bg_job_exited{job, status, exit_code, duration_ms, tail}`. The exit code comes from `ToolExecutionCompleteContentShellExit{shell_id, exit_code, output_preview}` (SV type) when one arrives, else it shows as unknown; which event carries it for a background shell is probe V19. The harness then sends the owner a `Notify` mail with the exit code and the last 20 lines (`Enqueue` when mid-turn, a new turn when idle), so agents never poll their jobs (INF). copilot-cli #4946 reports an HTTP 400 after a background shell completion; V19 checks it on each BYOK route.","updates":["bg_job_exited","mail_created","mail_state"],"action":"","refs":[{"label":"ToolExecutionCompleteContentShellExit","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L4868-L4887"}]},"R1":{"id":"R1","surface":"Right rail","element":"View buttons","kind":"Client","status":"CLIENT","shows":"Which side-panel view is open. With Details off: Agents, Task board and Mailbox. With Details on (H14) also Run, Plan, Background, Worktrees and Event log, below a divider. The harness puts nothing on the host app's left rail (X2).","source":"Client state.","updates":[],"action":"Click opens that view in the side panel; clicking the open view closes the panel. In the Code view a click switches back to Chat. On phones the rail is hidden and the panel lists the same views as tabs.","refs":[]},"R2":{"id":"R2","surface":"Right rail","element":"Mailbox badge","kind":"Harness","status":"INF","shows":"Mail needing attention.","source":"Asks to the user not yet answered + user-sent mail still `held` or `submitted`.","updates":["mail_created","mail_state"],"action":"","refs":[]},"R3":{"id":"R3","surface":"Right rail","element":"Task board badge","kind":"Harness","status":"INF","shows":"Plan versions awaiting approval.","source":"Count of `PlanVersion` in `awaiting_approval`.","updates":["plan_version_created","plan_decided"],"action":"","refs":[]},"X1":{"id":"X1","surface":"Sample data","element":"Illustrative content","kind":"Sample","status":"SAMPLE","shows":"Run names, the repository 'payments-api', branch names, model names, file paths, code, message text, token counts and timings.","source":"Invented to exercise the wiring above. None of it was produced by an API.","updates":[],"action":"","refs":[]},"X2":{"id":"X2","surface":"Sample data","element":"Host app rail (placeholder)","kind":"Sample","status":"SAMPLE","shows":"Stands in for the host app's own left rail (Chat, Jira, GitHub, …). The harness adds nothing to it; its views open from the right rail (R1).","source":"Not part of the harness. Drawn only so the mockup shows where the harness sits inside the host app.","updates":[],"action":"Clicks show a placeholder message.","refs":[]},"D1":{"id":"D1","surface":"Derived","element":"Agent display status","kind":"Harness","status":"SV+INF","shows":"running · needs_permission · needs_answer · waiting_on_agents · idle · starting · rotating · completed · failed · cancelled · crashed","source":"starting: record exists, session not started. running: an `assistant.turn_start` (SV) seen with no later `session.idle` (SV). needs_permission: running and the harness holds an unresolved `PermissionHandler` call. needs_answer: `AgentStatus::InputRequired` (open Ask with a wait, or a pending `UserInputHandler` call). idle: last `session.idle{aborted: false}` and nothing open. waiting_on_agents: idle with at least one child running or needs_*. rotating: a rescue trigger fired and the agent is between its safe point and the new session's start (section 4.3). Terminal states come from `AgentStatus`.","updates":["agent_status","copilot:assistant.turn_start","copilot:session.idle","permission","mail_state"],"action":"","refs":[{"label":"AssistantTurnStartData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L3191-L3202"},{"label":"SessionIdleData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L1392-L1398"}]},"D2":{"id":"D2","surface":"Derived","element":"Activity line","kind":"SDK + Harness","status":"SV+INF","shows":"One line saying what the agent is doing.","source":"Latest `assistant.intent{intent}` (SV) since the last `assistant.turn_start`; else the private checklist item `in_progress`; else the last `tool_title` / `tool_name`. Cut to 80 chars.","updates":["copilot:assistant.intent","scratch_todos","tool_started"],"action":"","refs":[{"label":"AssistantIntentData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e13a492093be0287d7885123f/rust/src/generated/session_events.rs#L3264-L3266"}]},"D3":{"id":"D3","surface":"Derived","element":"Step X of Y","kind":"Harness","status":"INF","shows":"Progress through the private checklist.","source":"Y = number of checklist items; X = completed items + 1 if one is `in_progress`. Hidden when the agent has no checklist.","updates":["scratch_todos"],"action":"","refs":[]},"D4":{"id":"D4","surface":"Derived","element":"Task display status","kind":"Harness","status":"INF","shows":"Done · In progress · Needs answer · Blocked · Ready · Waiting · Proposed · Failed · Cancelled","source":"`completed` → Done; `in_progress` → In progress; `input_required` → Needs answer; `blocked{…}` → Blocked; `proposed` → Proposed; `pending` with every `blocked_by` completed and no lease → Ready; `pending` otherwise → Waiting (on the unmet ids).","updates":["task_changed","task_ready"],"action":"","refs":[]},"D5":{"id":"D5","surface":"Derived","element":"Context %","kind":"SDK","status":"SV","shows":"Share of the context window in use.","source":"`round(100 × current_tokens / token_limit)` from the latest `session.usage_info` of the agent's current generation. Unknown after a new generation until its first `session.usage_info`; unchanged by a resume.","updates":["usage"],"action":"","refs":[{"label":"SessionUsageInfoData","href":"https://github.com/github/copilot-sdk/blob/ffd25c775742f73e1 use std::time::{Duration, Instant};

use openidconnect::core::{CoreClient, CoreProviderMetadata};
use openidconnect::reqwest::async_http_client;

    pub async fn discover(s: &OidcSettings) -> anyhow::Result<Self> {

        let client = CoreClient::from_provider_metadata(
            meta, s.client_id.clone(), None);
        Ok(Self { client, fetched_at: Instant::now() })
    }

    pub fn is_stale(&self) -> bool {
        self.fetched_at.elapsed() > JWKS_TTL
    }

    }

/* ======================= connection (C26, H10) ======================= */
/* One banner reports a lost link. Everything else freezes at its last known value and refuses commands.
   H10 fakes an outage of about 12 s; retries follow the backoff in C26. */
const OFFLINE_BLOCK = new Set(['send','answer','reply-send','plan-approve','plan-reject','perm','stop','sendnow','retract','jstop']);
const BACKOFF = [2,4,8,16,30];
function markOffline(){ if(state.conn==='ok') return; document.querySelectorAll('[data-act]').forEach(b=>{ if(OFFLINE_BLOCK.has(b.dataset.act)) b.setAttribute('aria-disabled','true'); }); }
function renderConn(){
  const el=$('#connbar'); if(state.conn==='ok'){ el.innerHTML=''; return; }
  const fresh=!el.firstElementChild;
  const re=state.conn==='re', last=fmt(state.connSeq), left=Math.max(0,Math.ceil((state.connNext-Date.now())/1000));
  el.innerHTML = `<div class="lb ${re?'re':''} ${fresh?'in':''}" ${wa('C26')}>
    <div class="lb-in">
      <span class="lb-ic">${re?'<span class="spin" aria-hidden="true"></span>':ic('alert')}</span>
      <div class="lb-txt"><b>${re?'Reconnecting to the harness…':'Lost connection to the harness'}</b>
        <span class="lb-sub">${re?`Asking for everything after seq ${last}.`:`${state.connNote?state.connNote+' ':''}Showing the last state received (seq ${last}). Approvals and messages wait until the link is back.`}</span></div>
      ${re?'':`<span class="lb-retry" id="connLeft" aria-hidden="true">Retrying in ${left}s · attempt ${state.connTry+1}</span>`}
      <div class="lb-act">
        <button class="btn xs primary" data-act="conn-retry" ${re?'disabled':''}>${ic('rotate','sm')}Retry now</button>
        <button class="btn xs ghost" data-act="conn-diag">${ic('pulse','sm')}Diagnostics</button>
        <button class="ibtn" data-act="conn-more" aria-expanded="${state.connMore}" aria-label="${state.connMore?'Hide':'Show'} connection details">${ic(state.connMore?'down':'chev','sm')}</button>
      </div>
    </div>
    ${state.connMore?`<dl class="lb-det"><dt>reason</dt><dd>socket closed (1006): harness gateway unreachable at 127.0.0.1:7400</dd><dt>last seq</dt><dd>${last}</dd><dt>retryable</dt><dd>yes</dd><dt>resumes with</dt><dd>WS /api/runs/r12/stream?since_seq=${state.connSeq+1}</dd><dt>backoff</dt><dd>2 s, 4 s, 8 s, 16 s, then every 30 s</dd><dt>offline since</dt><dd>${clock(state.frozenAt)}</dd></dl>`:''}
  </div>`;
}
function dropLink(){
  state.frozenAt=runNow(); const t=Date.now();
  Object.assign(state,{conn:'down',connAt:t,connTry:0,connNext:t+BACKOFF[0]*1000,connBack:t+12000,connSeq:state.seq,connNote:'',connMore:false});
  $('#tip').hidden=true; renderAll(true);
}
function tryLink(manual){
  if(state.conn!=='down') return;
  state.conn='re'; renderConn();
  setTimeout(()=>{ if(state.conn!=='re') return;
    if(Date.now()>=state.connBack){ linkBack(); return; }
    state.connTry++; state.connNext=Date.now()+BACKOFF[Math.min(state.connTry,BACKOFF.length-1)]*1000;
    state.conn='down'; state.connNote=manual?'Still unreachable.':''; renderConn(); },900);
}
function linkBack(){
  const secs=Math.round((Date.now()-state.connAt)/1000), n=Math.max(9,secs*3);
  state.seq+=n-1; logEvent('harness','resync',`stream resumed · since_seq ${fmt(state.connSeq+1)} · replayed ${n} events`);
  const p=PERMS.p1; if(p.state==='open') p.left=Math.max(0,p.left-secs);
  state.conn='ok'; state.connNote=''; toast(`Back online · replayed ${n} events`); renderAll(true);
}
function connTick(){
  if(state.conn!=='down') return;
  const left=Math.ceil((state.connNext-Date.now())/1000);
  if(left<=0){ tryLink(false); return; }
  const el=document.getElementById('connLeft'); if(el) el.textContent=`Retrying in ${left}s · attempt ${state.connTry+1}`;
}

const app=$('#app');
const now=()=>new Date().toTimeString().slice(0,5);
function logEvent(src,type,detail){ state.seq++; EVENTS.unshift([state.seq,src,type,detail]); EVENTS.length=Math.min(EVENTS.length,12); state.win=Math.min(4096,state.win+1); return state.seq; }

function send(){
  const el=$('#input'); let text=el.value.trim(); if(!text) return;
  if(state.conn!=='ok'){ toast('Reconnect first: your draft stays here'); return; }
  let tgt=state.target; const at=text.match(/^@([\w-]+)\s+/);
  if(at && AG[at[1]]){ tgt=at[1]; text=text.slice(at[0].length); }
  el.value='';
  if(tgt==='orchestrator'){
    T.orchestrator.push({t:'user',time:now(),text});
    logEvent('orchestrator','user_message','delivery: idle (starts a turn)');
    renderAll(false);
    setTimeout(()=>{ T.orchestrator.push({t:'asst',agent:'orchestrator',md:'<p>Noted. I’ll fold this into the next task update and tell the affected teammates.</p>',meta:['4.1s','0.9k tokens']}); renderAll(state.view!=='orchestrator'); },1100);
    return;
  }
  const A=AG[tgt], running=A.status==='running', steer=running&&state.steer;
  const id='u'+Date.now();
  const seq=logEvent('harness','mail_created',`you → ${tgt} · steer · ${steer?'Immediate':'Enqueue'}`);
  MAIL.push({id,from:'you',to:tgt,kind:'steer',time:now(),seq,state:'submitted',text});
  T[tgt].push({t:'steer',id}); T.orchestrator.push({t:'steer',id});
  renderAll(false);
  const land=(delivery)=>{ const m=mail(id); if(m.state!=='submitted') return; m.state='in_context'; m.delivery=delivery; m.seq=logEvent(tgt,'user.message',`delivery: ${delivery}`); renderAll(true); };
  if(!running){ setTimeout(()=>land('idle'),700); if(A.status==='idle'){ A.status='running'; A.act='Reading your message'; setTimeout(()=>{ if(A.status==='running'){A.status='idle'; A.act='Idle: T4 waits on T2 and T3'; renderAll(true);} },4500);} }
  else if(steer) setTimeout(()=>land('steering'),700);
  else setTimeout(()=>land('queued'),8000);
}
/* A job left Running: record bg_job_exited, tell the owner (Notify, Enqueue if mid-turn), add the B6 divider. */
function endJob(j, st, code, byAgentStop){
  j.st=st; j.code=code; j.ended=simClock(); j.dur=fdur(j.t);
  const what = st==='cancelled' ? 'cancelled (session.tasks.cancel)' : `exit ${code}`;
  const seq=logEvent('harness','bg_job_exited',`${j.id} · ${j.agent} · ${what} · ${j.dur}`);
  if(byAgentStop){ T[j.agent].push({t:'bgexit',id:j.id,note:`cancelled because ${j.agent} was stopped`}); return; }
  const A=AG[j.agent], idle=A.status==='idle';
  const text = st==='cancelled' ? `Background job ${j.id} was stopped by the user after ${j.dur}: ${j.cmd}`
    : `Background job ${j.id} ${st==='failed'?'failed with exit '+code:'exited '+code} after ${j.dur}: ${j.cmd} · ${j.out[j.out.length-1].trim()}`;
  MAIL.push({id:'n'+j.id,from:'harness',to:j.agent,kind:'notify',time:simClock(),seq,state:idle?'in_context':'submitted',delivery:idle?'idle':undefined,text});
  T[j.agent].push({t:'bgexit',id:j.id,mail:'n'+j.id});
}
function bgOut(j, lines, replaceLast){ if(replaceLast) j.out.pop(); j.out.push(...lines); if(j.out.length>200) j.out.splice(0,j.out.length-200); j.v=(j.v||0)+1; }
function paintJobs(){

function answer(v){

function permDecide(v){
  closeAt('p1',v);
